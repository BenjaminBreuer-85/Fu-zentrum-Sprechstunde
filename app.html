.ob-split{max-width:1200px;margin:0 auto}
.ob-form{max-width:800px;margin:0 auto}
.ob-preview{display:none}
.ob-mobile-preview{display:block}
@media(min-width:1024px){.ob-split{display:flex;gap:20px;max-width:1400px}.ob-form{flex:1;min-width:0;max-width:750px;margin:0}.ob-preview{display:block!important;flex:0 0 440px;position:sticky;top:14px;align-self:flex-start;max-height:calc(100vh - 28px);overflow-y:auto}.ob-mobile-preview{display:none!important}}`}</style>
      {toast&&<div style={{position:"fixed",bottom:16,right:16,padding:"10px 20px",borderRadius:8,background:"#005F63",color:"#fff",fontSize:12,fontWeight:500,zIndex:99}}>{toast}</div>}

      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,maxWidth:1400,margin:"0 auto 12px"}}>
        <div style={{width:28,height:28,borderRadius:6,background:"linear-gradient(135deg,#006B6F,#006B6F)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>📋</div>
        <div><div style={{fontSize:15,fontWeight:700,color:"#006B6F"}}>OP-Bericht Generator</div><div style={{fontSize:10,color:"#718096"}}>Orthopädie · Entscheidungsbaum v12</div></div>
      </div>

      <div className="ob-split">
      <div className="ob-form">

      {/* GESCHLECHT + SEITE */}
      <div style={card}>
        <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
          <div><div style={{fontSize:10,color:"#718096",fontWeight:700,marginBottom:3}}>GESCHLECHT</div><div style={row}><div style={gb(gender==="m")} onClick={()=>setGender("m")}>♂ M</div><div style={gb(gender==="w")} onClick={()=>setGender("w")}>♀ W</div></div></div>
          <div><div style={{fontSize:10,color:"#718096",fontWeight:700,marginBottom:3}}>OP-SEITE</div><div style={row}><div style={gb(side==="links")} onClick={()=>setSide("links")}>← L</div><div style={gb(side==="rechts")} onClick={()=>setSide("rechts")}>R →</div></div></div>
          <div><div style={{fontSize:10,color:"#718096",fontWeight:700,marginBottom:3}}>ALTER</div><div style={row}><div style={gb(alter==="erw")} onClick={()=>setAlter(alter==="erw"?"":"erw")}>≥18 J.</div><div style={{...gb(alter==="kind"),borderColor:alter==="kind"?"#E65100":"",color:alter==="kind"?"#E65100":"",background:alter==="kind"?"rgba(230,81,0,.08)":""}} onClick={()=>setAlter(alter==="kind"?"":"kind")}>{"<18 J. ⚠"}</div></div></div>
        </div>
      </div>

      {/* SEKTION */}
      <div style={card}>
        <div style={{fontSize:10,color:"#718096",fontWeight:700,marginBottom:6}}>SEKTION</div>
        <div style={row}>
          <div style={gb(sektion==="fuss")} onClick={()=>setSektion(sektion==="fuss"?"":"fuss")}>🦶 Fuß / Sprunggelenk</div>
          <div style={gb(sektion==="uc")} onClick={()=>setSektion(sektion==="uc"?"":"uc")}>🦴 UC</div>
          <div style={gb(sektion==="endo")} onClick={()=>setSektion(sektion==="endo"?"":"endo")}>🦿 Endo</div>
          <div style={gb(sektion==="ws")} onClick={()=>setSektion(sektion==="ws"?"":"ws")}>🦴 WS</div>

        </div>
      </div>

      {sektion==="fuss"&&<>
      <div style={card}><div style={h3s}>① Präop</div>
        <div style={row}>{[["standard","Standard"],["me","ME"],["tep","TEP"]].map(([k,l])=><div key={k} style={chip(praeType===k)} onClick={()=>setPraeType(k)}>{l}</div>)}</div>
        <div style={{...row,marginTop:6}}><div style={{...tog(risk),borderColor:risk?"#E65100":"",color:risk?"#EF6C00":""}} onClick={()=>setRisk(!risk)}>⚠ Risiko</div></div>
        {risk&&<input placeholder="Risikogrund..." value={riskTxt} onChange={e=>setRiskTxt(e.target.value)} style={{marginTop:4}}/>}
        <textarea placeholder="Freitext..." value={fprae} onChange={e=>setFprae(e.target.value)} rows={1} style={{marginTop:4}}/>
      </div>

      <div style={card}><div style={h3s}>② Vorbereitung</div>
        <div style={{...row,gap:6}}><div style={chip(lage==="ruecken")} onClick={()=>setLage("ruecken")}>Rückenlage</div><div style={chip(lage==="bauch")} onClick={()=>setLage("bauch")}>Bauchlage</div><div style={tog(ss)} onClick={()=>setSs(!ss)}>💊 Single-Shot</div><div style={tog(bs)} onClick={()=>setBs(!bs)}>🩸 Blutsperre</div><div style={chip(ana==="lokal")} onClick={()=>setAna(ana==="lokal"?"narkose":"lokal")}>💉 LA</div></div>
      </div>

      <div data-tour="ob-eingriff" style={{marginBottom:10}}><div style={h3s}>③ OP-Durchführung</div>

      {/* VORFUSS */}
      <OBSec title="🦶 Vorfuß" open={sec.vf} onToggle={()=>togSec("vf")} active={hasVF} onReset={()=>{setGz("");setMitAkin(false);setHoffTill(false);setMitSubcap(false);setZc({2:[],3:[],4:[],5:[]});setDmmo([]);}}>
        <div style={cat}>Großzehe (1. Strahl)</div>
        <div style={row}>
          {[["chevron","Chevron"],["lapidus","Lapidus"],["mtp1art","MTP-I-Arthrodese"],["cheilek","Cheilektomie"],["exostose","Exostose-Abtragung"],["scarf","Scarf/Mehrdim. OT"],["morton","Morton-Neurom"]].map(([k,l])=>
            <div key={k} style={chip(gz===k)} onClick={()=>{setGz(gz===k?"":k);setMitAkin(false);setHoffTill(false);setMitSubcap(false);}}>{l}</div>
          )}
        </div>
        {gz==="chevron"&&<div style={sub}><div style={tog(mitAkin)} onClick={()=>setMitAkin(!mitAkin)}>+ Akin</div><div style={{fontSize:10,color:"#718096",marginTop:3}}>Rebalancing auto · OPS: 5-788.5c, 5-788.40, 5-93b.0, 5-854.2c{mitAkin?", 5-788.56":""}</div></div>}
        {gz==="lapidus"&&<div style={sub}><div style={{...row,gap:4}}><div style={tog(mitSubcap)} onClick={()=>setMitSubcap(!mitSubcap)}>+ Subcap.</div><div style={tog(mitAkin)} onClick={()=>setMitAkin(!mitAkin)}>+ Akin</div></div><div style={{fontSize:10,color:"#718096",marginTop:3}}>Rebalancing auto · OPS: 5-808.a4, 5-93b.0, 5-93b.e{mitSubcap?", 5-788.5c":""}{mitAkin?", 5-788.56":""}</div></div>}
        {gz==="mtp1art"&&<div style={sub}><div style={tog(mitAkin)} onClick={()=>setMitAkin(!mitAkin)}>+ Akin</div><div style={tog(hoffTill)} onClick={()=>setHoffTill(!hoffTill)}>Hoffmann-Tillmann</div><div style={{fontSize:10,color:"#EF6C00",marginTop:3}}>⚠ Ruhigstellung! · OPS: 5-808.b0, 5-93b.0, 5-93b.e{mitAkin?", 5-788.56":""} · Stat: +5-784.0v (Spongiosa) · Amb: 5-784.0v NICHT kodieren!</div></div>}
        {gz==="cheilek"&&<div style={sub}><div style={{fontSize:10,color:"#718096"}}>OPS: 5-788.00 (Exostosenabtragung MT I) · Amb: H-DRG I20O · Stat: 5-854.2c/0c erwägen → I20E</div></div>}
        {gz==="morton"&&<div style={sub}><div style={{fontSize:10,color:"#718096"}}>OPS: 5-846.7 · ICD: G57.6 (zu bestätigen) · Intermetatarsalraum im Text anpassen</div></div>}

        <div style={cat}>Kleinzehen D2–D5</div>
        {[2,3,4,5].map(z=>{const sel=zc[z]||[];return <div key={z} style={{marginBottom:4,padding:sel.length?"6px 8px":"2px",borderRadius:6,background:sel.length?"rgba(0,107,111,.04)":"transparent"}}>
          <div style={{fontSize:11,fontWeight:600,color:sel.length?"#006B6F":"#718096",marginBottom:2}}>D{z}</div>
          <div style={row}>{zehenOpts.map(e=><div key={e.id} style={chip(sel.includes(e.id))} onClick={()=>togZehe(z,e.id)}>{e.l}</div>)}</div>
        </div>;})}

        <div style={cat}>DMMO (Metatarsale)</div>
        <div style={row}>{[2,3,4,5].map(mt=><div key={mt} style={chip(dmmo.includes(mt))} onClick={()=>togArr(dmmo,setDmmo,mt)}>MT {mt}</div>)}</div>
      </OBSec>

      {/* OSG */}
      <OBSec title="🦵 Oberes Sprunggelenk" open={sec.osg} onToggle={()=>togSec("osg")} active={hasOSG} onReset={()=>{setOsgOp([]);setBrostromIB(false);setAskOsteo(false);setAmicIKO(false);setAmicZyste(false);setAskVorher(false);setNanoSeite("medial");setOsgArtSchraube(true);setOsgArtPlatte(true);setOsgArtSpongiosa(false);}}>
        <div style={row}>
          {[["ask_nano","ASK + Nanofrakturierung"],["brostrom","Brostrom-Gould"],["arthrodese_osg","Arthrodese OSG"],["amic","AMIC-Talus"],["arthrodesenagel_retro","Arthrodesenagel (TTC)"]].map(([k,l])=>
            <div key={k} style={chip(osgOp.includes(k))} onClick={()=>togArr(osgOp,setOsgOp,k)}>{l}</div>
          )}
        </div>
        {osgOp.includes("arthrodese_osg")&&<div style={{marginTop:4,marginBottom:4}}>
          <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
            <div style={tog(osgArtPlatte)} onClick={()=>setOsgArtPlatte(!osgArtPlatte)}>+ Winkelstabile Platte</div>
            <div style={tog(osgArtSpongiosa)} onClick={()=>setOsgArtSpongiosa(!osgArtSpongiosa)}>+ Spongiosa (Beckenkamm)</div>
          </div>
          <div style={{fontSize:10,color:"#718096",marginTop:2}}>OPS: 5-808.70, 5-93b.0{osgArtPlatte?", 5-93b.e":""}{osgArtSpongiosa?", 5-784.0n, 5-783.0d":""}</div>
        </div>}
        {(osgOp.includes("ask")||osgOp.includes("ask_nano"))&&<div style={{marginTop:4,marginBottom:4}}><div style={tog(askOsteo)} onClick={()=>setAskOsteo(!askOsteo)}>+ Osteophytenentfernung</div>
          {osgOp.includes("ask_nano")&&<div style={{display:"flex",gap:4,marginTop:4}}><div style={tog(nanoSeite==="medial")} onClick={()=>setNanoSeite("medial")}>Mediale Talusschulter</div><div style={tog(nanoSeite==="lateral")} onClick={()=>setNanoSeite("lateral")}>Laterale Talusschulter</div></div>}
          <div style={{fontSize:10,color:"#718096",marginTop:2}}>OPS: 5-812.ek, 5-811.2k{osgOp.includes("ask_nano")?", 5-812.fk":""}{askOsteo?", 5-812.kk (Osteophyten)":""}{osgOp.includes("ask_nano")?" · "+nanoSeite+"e Talusschulter":""}</div></div>}
        {osgOp.includes("amic")&&<div style={{marginTop:4,marginBottom:4}}>
          <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
            <div style={tog(amicIKO)} onClick={()=>setAmicIKO(!amicIKO)}>+ Innenknöchelosteotomie</div>
            <div style={tog(amicZyste)} onClick={()=>setAmicZyste(!amicZyste)}>+ Zyste + Spongiosa</div>
            <div style={tog(askVorher)} onClick={()=>setAskVorher(!askVorher)}>+ ASK vorher</div>
          </div>
          <div style={{fontSize:10,color:"#718096",marginTop:2}}>OPS: 5-801.nk, 5-783.0, 5-784.0s{amicIKO?", 5-781.an, 5-93b.0 (IKO)":""}{askVorher?", 5-812.ek (ASK)":""}</div>
        </div>}
        {osgOp.includes("brostrom")&&<div style={{marginTop:4,marginBottom:4}}><div style={{display:"flex",gap:4,flexWrap:"wrap"}}><div style={tog(brostromIB)} onClick={()=>setBrostromIB(!brostromIB)}>+ Internal Brace</div><div style={tog(askVorher)} onClick={()=>setAskVorher(!askVorher)}>+ ASK vorher</div></div><div style={{fontSize:10,color:"#718096",marginTop:2}}>OPS: 5-806.5, 5-869.2, 5-782.1r{brostromIB?", 5-806.6 (Internal Brace)":""}{askVorher?", 5-812.ek (ASK)":""}</div></div>}
        {osgOp.includes("arthrodesenagel_retro")&&<div style={{marginTop:6}}>
          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            <span style={{fontSize:10,color:"#718096",minWidth:50}}>Länge:</span>
            <div style={chip(t2Length==="150")} onClick={()=>setT2Length("150")}>150 mm</div>
            <div style={chip(t2Length==="200")} onClick={()=>setT2Length("200")}>200 mm</div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginTop:4}}>
            <span style={{fontSize:10,color:"#718096",minWidth:50}}>Breite:</span>
            <div style={chip(t2Width==="10")} onClick={()=>setT2Width("10")}>10 mm</div>
            <div style={chip(t2Width==="11")} onClick={()=>setT2Width("11")}>11 mm</div>
            <div style={chip(t2Width==="12")} onClick={()=>setT2Width("12")}>12 mm</div>
          </div>
          <div style={{marginTop:4}}><div style={tog(arthroNagelBecken)} onClick={()=>setT2Becken(!arthroNagelBecken)}>+ Beckenkamm (Spongiosa)</div></div>
          <div style={{fontSize:10,color:"#718096",marginTop:4}}>Arthrodesenagel: {t2Length} mm × {t2Width} mm · TTC-Arthrodese{arthroNagelBecken?" + Beckenkamm":""}</div>
        </div>}
        {osgOp.length>0&&!osgOp.includes("brostrom")&&<div style={{fontSize:10,color:"#718096",marginTop:6}}>Ausgewählt: {osgOp.join(", ")} · Texte werden ergänzt</div>}
      </OBSec>

      {/* OSG-TEP (EIGENE SEKTION) */}
      <OBSec title="🏥 OSG-Totalendoprothese" open={sec.tep} onToggle={()=>togSec("tep")} active={hasTEP} onReset={()=>{setTepType("");setTepProphecy(false);setTepTibSz("");setTepTibLong(false);setTepTalSz("");setTepTalCut("chamfer");setTepInlaySz("");setTepInlayMM("");setIbTopStem("");setIbMidStem1("");setIbMidStem2("");setIbBaseStem("");setIbTalarStem("");}}>
        <div style={cat}>Primär-TEP — Low Profile</div>
        <div style={row}>
          <div style={chip(tepType==="primaer_infinity")} onClick={()=>{setTepType(tepType==="primaer_infinity"?"":"primaer_infinity");setTepTalCut("chamfer");setTepProphecy(false);}}>Infinity</div>
          <div style={chip(tepType==="primaer_vantage")} onClick={()=>{setTepType(tepType==="primaer_vantage"?"":"primaer_vantage");setTepTalCut("chamfer");setTepProphecy(false);setTepTibLong(false);}}>Vantage (Advita)</div>
        </div>
        <div style={{...cat,marginTop:8}}>Primär-TEP — Achsgeführt</div>
        <div style={row}>
          <div style={chip(tepType==="primaer_inbone")} onClick={()=>{setTepType(tepType==="primaer_inbone"?"":"primaer_inbone");setTepTalCut("flat");setTepProphecy(false);}}>Inbone II</div>
        </div>
        <div style={{...cat,marginTop:8}}>Wechsel-TEP</div>
        <div style={row}>
          <div style={chip(tepType==="wechsel_inbone")} onClick={()=>{setTepType(tepType==="wechsel_inbone"?"":"wechsel_inbone");setTepTalCut("flat");setTepProphecy(false);}}>Wechsel auf Inbone</div>
          <div style={chip(tepType==="wechsel_infinity")} onClick={()=>{setTepType(tepType==="wechsel_infinity"?"":"wechsel_infinity");setTepTalCut("chamfer");setTepProphecy(false);}}>Wechsel auf Infinity</div>
          <div style={chip(tepType==="wechsel_vantage")} onClick={()=>{setTepType(tepType==="wechsel_vantage"?"":"wechsel_vantage");setTepTalCut("chamfer");setTepProphecy(false);setTepTibLong(false);}}>Wechsel auf Vantage</div>
        </div>

        {tepType&&<div style={{...sub,marginTop:10}}>
          {tepType.includes("infinity")&&<div style={tog(tepProphecy)} onClick={()=>setTepProphecy(!tepProphecy)}>+ Prophecy (CT-basiert)</div>}

          {/* TIBIA */}
          <div style={{...cat,marginTop:10}}>Tibiale Komponente</div>
          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            <span style={{fontSize:10,color:"#718096",minWidth:40}}>Größe:</span>
            <div style={row}>{(tepType.includes("vantage")?["1","2","3","4"]:["1","2","3","4","5"]).map(s=><div key={s} style={chip(tepTibSz===s)} onClick={()=>setTepTibSz(tepTibSz===s?"":s)}>{s}</div>)}</div>
          </div>
          {!tepType.includes("vantage")&&["3","4","5"].includes(tepTibSz)&&<div style={{display:"flex",alignItems:"center",gap:8,marginTop:4}}>
            <span style={{fontSize:10,color:"#718096",minWidth:40}}>Länge:</span>
            <div style={tog(tepTibLong)} onClick={()=>setTepTibLong(!tepTibLong)}>Long</div>
          </div>}

          {/* TALUS */}
          <div style={{...cat,marginTop:10}}>Talare Komponente</div>
          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            <span style={{fontSize:10,color:"#718096",minWidth:40}}>Größe:</span>
            <div style={row}>{(tepType.includes("vantage")?["1","2","3","4"]:["1","2","3","4","5"]).map(s=><div key={s} style={chip(tepTalSz===s)} onClick={()=>setTepTalSz(tepTalSz===s?"":s)}>{s}</div>)}</div>
          </div>
          {tepType.includes("infinity")&&<div style={{display:"flex",alignItems:"center",gap:8,marginTop:4}}>
            <span style={{fontSize:10,color:"#718096",minWidth:40}}>Schnitt:</span>
            <div style={chip(tepTalCut==="chamfer")} onClick={()=>setTepTalCut("chamfer")}>Chamfer-Cut</div>
            <div style={chip(tepTalCut==="flat")} onClick={()=>setTepTalCut("flat")}>Flat Cut</div>
          </div>}
          {tepType.includes("vantage")&&<div style={{display:"flex",alignItems:"center",gap:8,marginTop:4}}>
            <span style={{fontSize:10,color:"#718096",minWidth:40}}>Schnitt:</span>
            <div style={chip(tepTalCut==="chamfer")} onClick={()=>setTepTalCut("chamfer")}>Standard (kurviert)</div>
            <div style={chip(tepTalCut==="flat")} onClick={()=>setTepTalCut("flat")}>Flat Cut</div>
          </div>}
          {tepType.includes("inbone")&&<div style={{fontSize:10,color:"#718096",marginTop:4}}>Inbone → immer Flat-Cut</div>}

          {/* INLAY */}
          <div style={{...cat,marginTop:10}}>Polyethylen-Inlay</div>
          {tepTibSz?<div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            <span style={{fontSize:10,color:"#718096",minWidth:40}}>Dicke:</span>
            <div style={row}>{(tepType.includes("vantage")?["6","7","8","9","10","11","12"]:["3","4"].includes(tepTibSz)?["6","7","8","9","10","11","12","13"]:["6","8","10","12"]).map(d=><div key={d} style={chip(tepInlayMM===d)} onClick={()=>setTepInlayMM(tepInlayMM===d?"":d)}>{d} mm</div>)}</div>
          </div>:<div style={{fontSize:10,color:"#EF6C00"}}>Bitte zuerst Tibia-Größe wählen</div>}

          {/* SCHAFTGRÖSSEN achsgeführte TEP */}
          {tepType.includes("inbone")&&<div>
            <div style={{...cat,marginTop:10}}>Stem-Größen (Fräsköpfe)</div>
            <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:4}}>
              <span style={{fontSize:10,color:"#718096",minWidth:70}}>Top Stem:</span>
              <div style={row}>{["12","14","16"].map(d=><div key={d} style={chip(ibTopStem===d)} onClick={()=>setIbTopStem(ibTopStem===d?"":d)}>{d} mm</div>)}</div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:4}}>
              <span style={{fontSize:10,color:"#718096",minWidth:70}}>Mid Stem:</span>
              <div style={row}>{["12","14","16","18"].map(d=><div key={d} style={chip(ibMidStem1===d)} onClick={()=>setIbMidStem1(ibMidStem1===d?"":d)}>{d} mm</div>)}</div>
            </div>
            {["4","5","6"].includes(tepTibSz)&&<div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:4}}>
              <span style={{fontSize:10,color:"#718096",minWidth:70}}>Mid Stem 2:</span>
              <div style={row}>{["14","16","18"].map(d=><div key={d} style={chip(ibMidStem2===d)} onClick={()=>setIbMidStem2(ibMidStem2===d?"":d)}>{d} mm</div>)}</div>
              <span style={{fontSize:10,color:"#718096"}}>(optional, Size 4–6)</span>
            </div>}
            <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:4}}>
              <span style={{fontSize:10,color:"#718096",minWidth:70}}>Base Stem:</span>
              <div style={row}>{(["2","3"].includes(tepTibSz)?["16"]:["4","5","6"].includes(tepTibSz)?["18"]:["16","18"]).map(d=><div key={d} style={chip(ibBaseStem===d)} onClick={()=>setIbBaseStem(ibBaseStem===d?"":d)}>{d} mm</div>)}</div>
              {["2","3"].includes(tepTibSz)&&<span style={{fontSize:10,color:"#718096"}}>Size 2–3: nur 16mm</span>}
              {["4","5","6"].includes(tepTibSz)&&<span style={{fontSize:10,color:"#718096"}}>Size 4–6: nur 18mm</span>}
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
              <span style={{fontSize:10,color:"#718096",minWidth:70}}>Talar Stem:</span>
              <div style={row}>{["10","14"].map(d=><div key={d} style={chip(ibTalarStem===d)} onClick={()=>setIbTalarStem(ibTalarStem===d?"":d)}>{d} mm</div>)}</div>
            </div>
          </div>}

          <div style={{fontSize:10,color:"#718096",marginTop:8}}>OPS: {tepType.startsWith("wechsel")?"5-827.10":"5-826.00"} · Stationär{tepType.startsWith("wechsel")?" · Wechseloperation":""}</div>
        </div>}
      </OBSec>

              var d = drgData;

                if(htepComp.length>0){ materialIst = htepComp.reduce(function(s,c){return s+(c.preis||0);},0); materialKomplette = true; }

              var hasReal = materialKomplette && inekImpRef !== null && inekImpRef !== undefined;
              var dbIIReal = hasReal ? dbII + (inekImpRef - materialIst) : null;
              var dbRealAmpel="⚪",dbRealColor="#718096",dbRealText="";

                {/* InEK-Fallkosten-Block */}

            {/* Materialkosten-Block — Komponenten-Aufschlüsselung mit InEK-Ampel (bei Duokopf + H-TEP) */}
            {(endoOp==="duokopf_uc"||endoOp==="htep") && (function(){
              var items = ENDO_IMPL_KOMPONENTEN[endoImplWahl] || [];
              return <MaterialkostenBlock items={items} drg={drgKey} />;

          </div>;
        })()}
      </div>}

      {sektion==="ws"&&<div>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,padding:"6px 10px",background:"rgba(255,193,7,.08)",border:"1px solid rgba(255,193,7,.3)",borderRadius:6,fontSize:10,color:"#BF360C"}}>
          ⚠ <span><strong>WS-Modul im Aufbau</strong> — Daten teils Platzhalter (DRG-Werte, CM, Implantatpreise). Vor produktiver Nutzung bitte Daten-TODO-Liste durchgehen.</span>
        </div>

        <div style={{fontSize:10,fontWeight:700,color:"#718096",marginBottom:6}}>EINGRIFF</div>

          {Object.keys(WS_EINGRIFFE).map(k=><div key={k} style={gb(wsOp===k)} onClick={()=>{setWsOp(wsOp===k?"":k);setWsHoehen([]);setWsSeiten({});}}>{WS_EINGRIFFE[k].l}</div>)}

          </div>
          {wsHoehen.length>0&&<div style={{marginTop:10,padding:"8px 10px",background:"rgba(0,0,0,.02)",border:"1px solid rgba(0,0,0,.08)",borderRadius:6}}>
            <div style={{fontSize:10,color:"#718096",fontWeight:700,marginBottom:6}}>SEITE PRO SEGMENT</div>
            {wsHoehen.map(s=><div key={s} style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
              <div style={{minWidth:60,fontSize:11,fontWeight:600,color:"#2D3748"}}>{s}</div>
              <div style={{display:"flex",gap:4}}>
                <div style={gb(wsSeiten[s]==="rechts")} onClick={()=>setWsSeiten({...wsSeiten,[s]:"rechts"})}>von rechts</div>
                <div style={gb(wsSeiten[s]==="links")} onClick={()=>setWsSeiten({...wsSeiten,[s]:"links"})}>von links</div>
              </div>
            </div>)}
          </div>}
        </div>}

        {wsOp&&WS_EINGRIFFE[wsOp]&&wsHoehen.length>0&&<div style={card}>
          <div style={{fontSize:13,fontWeight:700,color:"#2D3748",marginBottom:10}}>Fallsteuerung – {WS_EINGRIFFE[wsOp].l}</div>
          <div style={{padding:"8px 12px",background:"rgba(0,107,111,.08)",borderRadius:6,marginBottom:10,fontSize:10,lineHeight:1.5,color:"#2D3748"}}>
            <strong>ℹ Nicht hybrid-fähig</strong> — keine H-DRG, immer reguläre DRG. Stationäre Behandlung obligat.
          </div>
          <div style={{padding:"8px 12px",background:"rgba(255,193,7,.08)",borderRadius:6,marginBottom:8,fontSize:10,color:"#BF360C"}}>
            <strong>⚠ Datensatz unvollständig:</strong> DRG-Erlöswerte, CM 2026, UGVD und Implantatpreise sind noch nicht hinterlegt.
          </div>
          <div style={{fontSize:11,color:"#2D3748",lineHeight:1.5,whiteSpace:"pre-line"}}>{WS_EINGRIFFE[wsOp].hint}</div>
          <div style={{marginTop:10,fontSize:10,color:"#718096",fontWeight:700,borderTop:"1px solid rgba(0,0,0,.08)",paddingTop:8}}>AUSGEWÄHLT</div>
          <div style={{fontSize:11,color:"#2D3748",lineHeight:1.6}}>
            {wsOp==="kypho"
              ?<><strong>{wsHoehen.length}× Wirbel:</strong> {wsHoehen.join(" · ")}</>
              :<><strong>{wsHoehen.length}× Segment:</strong> {wsHoehen.map(s=>s+(wsSeiten[s]?" ("+wsSeiten[s]+")":" (Seite fehlt)")).join(" · ")}</>
            }
          </div>
          <div style={{marginTop:8,fontSize:10,color:"#718096",fontWeight:700}}>OPS-Codes</div>
          <div style={{fontSize:10,color:"#2D3748",fontFamily:"'IBM Plex Mono',ui-monospace,monospace"}}>{WS_EINGRIFFE[wsOp].ops.join(" · ")} <span style={{color:"#718096"}}>× {wsHoehen.length}</span></div>
          <div style={{marginTop:8,fontSize:10,color:"#718096",fontWeight:700}}>Codierhinweis</div>
          <div style={{fontSize:10,color:"#2D3748",lineHeight:1.5,whiteSpace:"pre-line"}}>{WS_EINGRIFFE[wsOp].kodier}</div>
        </div>}
      </div>}


      </div>{/* END ob-form */}

      {/* DESKTOP SIDEBAR PREVIEW (≥1024px) */}
      {canExport&&sektion==="fuss"&&<div className="ob-preview" style={{background:"rgba(255,255,255,.95)",border:"1px solid rgba(0,0,0,.08)",borderRadius:10,padding:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,flexWrap:"wrap",gap:6}}>
          <div style={{fontSize:12,fontWeight:700,color:"#006B6F",textTransform:"uppercase",letterSpacing:1}}>Vorschau</div>
          <div style={{display:"flex",gap:4}}>
            <div style={{padding:"5px 10px",border:"none",borderRadius:5,background:"#006B6F",color:"#F5F7FA",fontWeight:600,fontSize:10,cursor:"pointer"}} onClick={copy}>📋 Kopieren</div>
            <div style={{padding:"5px 10px",border:"none",borderRadius:5,background:"#005F63",color:"#fff",fontWeight:600,fontSize:10,cursor:"pointer"}} onClick={dlDocx}>📄 Word</div>
          </div>
        </div>
        <div style={{background:"transparent",border:"none",borderRadius:0,padding:"14px 0",fontFamily:"'Trebuchet MS',sans-serif",fontSize:"10pt",lineHeight:1.7,whiteSpace:"pre-wrap",color:"#2D3748",overflowY:"auto",maxHeight:"calc(100vh - 180px)"}}>{fullText}</div>
        {erloesData&&<div style={{marginTop:10,fontSize:10,padding:10,background:"rgba(0,107,111,.04)",border:"1px solid rgba(0,107,111,.12)",borderRadius:6,color:"#006B6F",whiteSpace:"pre-line"}}><span style={{fontWeight:700}}>Fallsteuerung – {erloesData.label}</span>{"\n"}H-DRG: {erloesData.hdrg} | EBM: {erloesData.ebm}{"\n"}Gekürzt: {erloesData.kurz} | Volle DRG: {erloesData.drg}{"\n"}Codierziel: {erloesData.empf==="amb"&&erloesData.hdrg!=="—"?"Ambulant Hybrid-DRG":erloesData.empf==="amb"?"Ambulant EBM":"Stationär ≥2N volle DRG"}{erloesData.kodier?"\n"+erloesData.kodier:""}</div>}
      </div>}

      </div>{/* END ob-split */}
    </div>
          );
}

function escXml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function createZip(files){
  const enc=new TextEncoder();
  const parts=[];const cd=[];let offset=0;const entries=Object.entries(files);
  for(const[name,content]of entries){
    const nameBytes=enc.encode(name);
    const dataBytes=enc.encode(content);
    // CRC32
    let crc=0xFFFFFFFF;const table=new Uint32Array(256);
    for(let i=0;i<256;i++){let c=i;for(let j=0;j<8;j++)c=c&1?0xEDB88320^(c>>>1):c>>>1;table[i]=c;}
    for(let i=0;i<dataBytes.length;i++)crc=table[(crc^dataBytes[i])&0xFF]^(crc>>>8);
    crc=(crc^0xFFFFFFFF)>>>0;
    // Local file header
    const lf=new ArrayBuffer(30+nameBytes.length);const lv=new DataView(lf);
    lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint16(6,0,true);lv.setUint16(8,0,true);
    lv.setUint16(10,0,true);lv.setUint16(12,0,true);lv.setUint32(14,crc,true);
    lv.setUint32(18,dataBytes.length,true);lv.setUint32(22,dataBytes.length,true);
    lv.setUint16(26,nameBytes.length,true);lv.setUint16(28,0,true);
    new Uint8Array(lf).set(nameBytes,30);
    parts.push(new Uint8Array(lf));parts.push(dataBytes);
    // Central directory
    const ce=new ArrayBuffer(46+nameBytes.length);const cv=new DataView(ce);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);
    cv.setUint16(8,0,true);cv.setUint16(10,0,true);cv.setUint16(12,0,true);cv.setUint16(14,0,true);
    cv.setUint32(16,crc,true);cv.setUint32(20,dataBytes.length,true);cv.setUint32(24,dataBytes.length,true);
    cv.setUint16(28,nameBytes.length,true);cv.setUint16(30,0,true);cv.setUint16(32,0,true);
    cv.setUint16(34,0,true);cv.setUint16(36,0,true);cv.setUint32(38,0,true);cv.setUint32(42,offset,true);
    new Uint8Array(ce).set(nameBytes,46);
    cd.push(new Uint8Array(ce));
    offset+=30+nameBytes.length+dataBytes.length;
  }
  let cdSize=0;cd.forEach(c=>cdSize+=c.length);
  const eocd=new ArrayBuffer(22);const ev=new DataView(eocd);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(4,0,true);ev.setUint16(6,0,true);
  ev.setUint16(8,entries.length,true);ev.setUint16(10,entries.length,true);
  ev.setUint32(12,cdSize,true);ev.setUint32(16,offset,true);ev.setUint16(20,0,true);
  const allParts=[...parts,...cd,new Uint8Array(eocd)];
  const totalLen=allParts.reduce((s,p)=>s+p.length,0);
  const result=new Uint8Array(totalLen);let pos=0;
  for(const p of allParts){result.set(p,pos);pos+=p.length;}
  return result;
}

function buildDocx(fullText,erloesText){
  const ps=[];
  const addP=(text,bold=false,size=22)=>{
    if(!text)return;
    text.split('\n').forEach(line=>{
      if(!line.trim()){ps.push('<w:p><w:pPr><w:spacing w:after="0"/></w:pPr></w:p>');return;}
      const rpr=`<w:rPr>${bold?'<w:b/>':''}<w:sz w:val="${size}"/><w:szCs w:val="${size}"/><w:rFonts w:ascii="Arial" w:hAnsi="Arial"/></w:rPr>`;
      ps.push(`<w:p><w:pPr><w:spacing w:after="80" w:line="276" w:lineRule="auto"/><w:jc w:val="both"/></w:pPr><w:r>${rpr}<w:t xml:space="preserve">${escXml(line)}</w:t></w:r></w:p>`);
    });
  };
  // Title
  ps.push(`<w:p><w:pPr><w:spacing w:after="200"/></w:pPr><w:r><w:rPr><w:b/><w:sz w:val="32"/><w:szCs w:val="32"/><w:rFonts w:ascii="Arial" w:hAnsi="Arial"/></w:rPr><w:t>OP-Bericht</w:t></w:r></w:p>`);
  addP(fullText);
  if(erloesText){
    ps.push(`<w:p><w:pPr><w:spacing w:before="300" w:after="200"/></w:pPr><w:r><w:rPr><w:b/><w:sz w:val="26"/><w:szCs w:val="26"/><w:rFonts w:ascii="Arial" w:hAnsi="Arial"/><w:color w:val="2E5090"/></w:rPr><w:t>Fallsteuerung</w:t></w:r></w:p>`);
    addP(erloesText,false,20);
  }
  ps.push('<w:p><w:pPr><w:spacing w:before="300"/></w:pPr></w:p>');
  addP("Operateur: ___________________________",false,20);
  addP("Datum: ___________________________",false,20);

  const contentTypes=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>

function buildPraeop(g,side,risk,riskTxt,frei,typ){const dd=g==="m"?"Der Patient":"Die Patientin",dd2=g==="m"?"der Patient":"die Patientin",sa=side==="links"?"linken":"rechten";let t="";if(typ==="me")t=`${dd} stellte sich bei uns vor zur geplanten Metallentfernung am ${sa} Fuß. Über die operativen Alternativen und die Möglichkeit des Belassens des Materials wurde ${dd2} informiert. Es bestehen operative Risiken, diese wurden thematisiert.`;else if(typ==="tep")t=`${dd} stellte sich bei uns vor mit Beschwerden am ${sa} Fuß. Nach ausführlicher Abwägung wurde die Implantation einer Sprunggelenksprothese am ${sa} oberen Sprunggelenk vereinbart. Die Indikation, die nicht-operativen und operativen Alternativen sowie die Details mit Komplikationen und Nachbehandlung wurden erneut erläutert. ${dd} wünscht keine weiteren konservativen Maßnahmen. Operative Risiken wurden thematisiert.`;else t=`${dd} stellte sich bei uns vor mit Beschwerden am ${sa} Fuß. Nach ausführlicher Abwägung wurde der operative Eingriff vereinbart. ${dd} wünscht keine Durchführung weiterer konservativer Maßnahmen. Über die operativen und nicht-operativen Alternativen wurde ${dd2} informiert. Es bestehen operative Risiken, diese wurden thematisiert.`;if(risk){t+=`\nEs erfolgte eine spezifische Aufklärung, dass ${dd2} einer Risikogruppe angehört`;if(riskTxt.trim())t+=` (${riskTxt.trim()})`;t+=` und ein erhöhtes Risiko für jegliche intra- oder postoperative Komplikation besteht.`;}if(frei.trim())t+=`\n${frei.trim()}`;return t;}

function buildLagerung(side,bs,ss,ana,lage){const sa=side==="links"?"linken":"rechten";let p=[];if(ss)p.push("Single-Shot-Antibiose entsprechend Hausstandard durch die Anästhesie");p.push("Lagerung in "+(lage==="bauch"?"Bauchlage":"Rückenlage")+", Polsterung aller druckgefährdeten Stellen, insbesondere aller Stellen an denen Nerven durch Kompression geschädigt werden könnten");p.push("Precleaning des gesamten OP-Gebietes");if(bs)p.push("Anlage der Oberschenkelblutsperre unter Nutzung eines Polsterstrumpfes und wasserdichter Versiegelung nach distal, so dass keine Flüssigkeit unter die Sperre oder in das Polster laufen kann");p.push("Abwaschen und Abdecken entsprechend den aktuellen Hygienestandards, Abkleben der Zehen und der Teile des Vorfußes, die nicht zum OP-Gebiet gehören mit Inzisionsfolie");p.push("Durchführen Team-Time-Out");if(bs)p.push("Aufblasen der Blutsperre auf 300 mmHg");let t=p.join(", ")+".";if(ana==="lokal")t+="\nSterile Applikation Lokalanästhesie.";t+="\n\nNarkoseuntersuchung des betroffenen und der angrenzenden Gelenke unter spezifischer Beachtung der Bandstabilität und der Achsverhältnisse.\nEinzeichnen der relevanten Anatomie des OP-Gebietes, insbesondere Verlauf von Nerven, Gefäßen, Sehnen und knöcherner Marker.";return t;}

function buildVerband(hasVorfuss,bs,ruhig){let p=["Spülung aller Zugänge","Abschlussdesinfektion","schichtweiser Verschluss","Atraumatische Hautnaht","Steri-Strips"];if(hasVorfuss)p.push("Tape-Verband","Anlegen eines sterilen redressierenden Verbandes");p.push("circulärer Watte-Kompressionsverband");if(hasVorfuss)p.push("Tape-Zügelungsverband in Redressionstellung");if(bs)p.push("Öffnung der Blutsperre, die Recapillarisierung ist an allen Zehen regelrecht");if(ruhig==="orthese")p.push("Anlage Omnimed-Schiene");else if(ruhig==="gips")p.push("Anlage Gipsschiene");else if(ruhig==="cast")p.push("Anlage circulärer gepolsterter Cast");p.push("Entlagerung");return p.join(", ")+".";}

function HDRGSearch(){
  const [q,setQ]=useState("");
  const [results,setResults]=useState([]);
  const [searched,setSearched]=useState(false);

  // OPS-Code Zuordnung 2026 — Flag-Modell (Bitmaske f: 1=AOP, 2=Hybrid-DRG, 4=Kontextprozedur)
  const HDRG_LIST=useMemo(function(){return window._HD.map(function(e){return{code:e[0],desc:e[1],f:e[2]};});},[]);
  const COUNTS=useMemo(function(){
    var c={aop:0,hybrid:0,kontext:0,gesamt:HDRG_LIST.length};
    HDRG_LIST.forEach(function(r){if(r.f&1)c.aop++;if(r.f&2)c.hybrid++;if(r.f&4)c.kontext++;});
    return c;
  },[HDRG_LIST]);
  const META=window._KATALOG_META||{};
  const nf=function(n){return n.toLocaleString("de-DE");};

  function doSearch(){
    if(!q.trim()){setResults([]);setSearched(false);return;}
    var term=q.trim().toLowerCase();
    setSearched(true);
    var exact=HDRG_LIST.filter(function(x){return x.code.toLowerCase()===term;});
    if(exact.length>0){setResults(exact);return;}
    var prefix=HDRG_LIST.filter(function(x){return x.code.toLowerCase().startsWith(term);});
    if(prefix.length>0){setResults(prefix.slice(0,50));return;}
    var text=HDRG_LIST.filter(function(x){return x.code.toLowerCase().includes(term)||x.desc.toLowerCase().includes(term);});
    setResults(text.slice(0,50));
  }

  // Badge-Definitionen · Rahmen-/Hintergrundfarbe nach Prioritaet Hybrid > AOP > Kontext
  function badges(f){
    var b=[];
    if(f&2)b.push({label:"Hybrid-DRG",color:"#006B6F",bg:"rgba(0,107,111,.04)"});
    if(f&1)b.push({label:"AOP-Katalog",color:"#1565C0",bg:"rgba(25,118,210,.04)"});
    if(f&4)b.push({label:"Kontextprozedur",color:"#E65100",bg:"rgba(230,81,0,.06)"});
    return b;
  }

  return <div style={{padding:16}}>
    <div style={{display:"flex",gap:8,marginBottom:16}}>
      <input value={q} onChange={e=>{setQ(e.target.value);setSearched(false);}} onKeyDown={e=>{if(e.key==="Enter")doSearch();}} placeholder="OPS-Code oder Suchbegriff..." style={{flex:1,padding:"8px 12px",borderRadius:6,border:"1px solid rgba(0,107,111,.3)",fontSize:12,background:"rgba(255,255,255,.95)"}}/>
      <div onClick={doSearch} style={{padding:"8px 16px",borderRadius:6,background:"#006B6F",color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer"}}>Suchen</div>
    </div>
    <div style={{fontSize:10,color:"#718096",marginBottom:12}}>
      Beispiele: <span style={{fontFamily:"monospace",color:"#006B6F"}}>5-788.5c</span> (Chevron) · <span style={{fontFamily:"monospace",color:"#006B6F"}}>5-793.kr</span> (Weber B WSP) · <span style={{fontFamily:"monospace",color:"#006B6F"}}>5-808.a4</span> (Lapidus – nicht gelistet!)<br/>
      Freitextsuche: z.B. „Arthrodese", „Metatarsale", „Sehne"
    </div>
    {searched&&results.length===0&&<div style={{padding:20,textAlign:"center",color:"#718096"}}>
      <div style={{fontSize:13}}>Kein Treffer für „{q}"</div>
      <div style={{fontSize:10,marginTop:4}}>→ Code steht NICHT im Hybrid-DRG-Leistungskatalog, NICHT im AOP-Katalog und ist KEINE Kontextprozedur.</div>
    </div>}
    {results.length>0&&<div>
      <div style={{fontSize:10,color:"#718096",marginBottom:6}}>{results.length} Treffer{results.length>=50?" (max. 50 angezeigt)":""}</div>
      {results.map(function(r,i){
        var bl=badges(r.f);
        var prim=bl[0];
        var kx=((r.f&4)&&window._KX&&window._KX[r.code])||null;
        return <div key={i} style={{padding:"8px 12px",marginBottom:4,borderRadius:6,border:"1px solid "+prim.color,background:prim.bg}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,flexWrap:"wrap"}}>
            <div style={{flex:"1 1 200px",minWidth:0}}>
              <span style={{fontFamily:"'IBM Plex Mono',ui-monospace,monospace",fontSize:12,fontWeight:700,color:prim.color}}>{r.code}</span>
              <span style={{fontSize:10,color:"#2D3748",marginLeft:8}}>{r.desc}</span>
            </div>
            <div style={{display:"flex",gap:4,flexWrap:"wrap",justifyContent:"flex-end"}}>
              {bl.map(function(b,j){return <span key={j} style={{fontSize:10,padding:"2px 6px",borderRadius:4,background:"#fff",border:"1px solid "+b.color,color:b.color,fontWeight:600,whiteSpace:"nowrap"}}>{b.label}</span>;})}
            </div>
          </div>
          {kx&&<div style={{fontSize:10,color:"#92400E",marginTop:6,fontWeight:600,background:"#FEF3C7",padding:"3px 8px",borderRadius:4,display:"inline-block",border:"1px solid #F59E0B"}}>⚠ NICHT Kontextprozedur bei: {kx.join(", ")}</div>}
        </div>;
      })}
    </div>}
    <div style={{marginTop:16,fontSize:10,color:"#A0AEC0",textAlign:"center",lineHeight:1.6}}>
      Quellen ({META.jahr}): Hybrid-DRG: {META.hybrid} ({nf(COUNTS.hybrid)} OPS) · AOP: {META.aop} ({nf(COUNTS.aop)} OPS) · {META.kontext} ({nf(COUNTS.kontext)} OPS)<br/>
      {nf(COUNTS.gesamt)} eindeutige Codes · Regel: Hybrid-Vorrang vor AOP
    </div>
  </div>;
}

function OPManuale(){

            onMouseEnter={function(e){e.currentTarget.style.border="1px solid #006B6F";e.currentTarget.style.background="rgba(0,107,111,.04)";}}

                <div style={{fontSize:10,color:"#718096",marginTop:2}}>{it.desc}</div>
              </div>
            </div>
          </a>;})}
        </div>}
      </div>;
    })}
    <div style={{marginTop:16,fontSize:10,color:"#A0AEC0",textAlign:"center"}}>PDFs werden direkt von GitHub/Google Drive geladen · Klick öffnet in neuem Tab</div>
  </div>;

// ==========================================================================
// CODE-ÜBERSICHT
// Zeigt alle in OP_STEUERUNG verwendeten Codes mit Bezeichnung, Eingriff und Rolle.
// Nutzt zentrale OPS_LABELS als Quelle. Eine einzige Stelle, um Inkonsistenzen zu finden.
// ==========================================================================
function CodeUebersicht(){
  const [filter,setFilter]=useState("");

  // Sammel: pro Code alle Verwendungen
  const usage={};
  const add=(code,eingriffKey,rolle)=>{
    if(!code)return;
    if(!usage[code])usage[code]={code:code,label:OPS_LABELS[code]||"",nichtInBib:!OPS_LABELS[code],uses:[]};
    usage[code].uses.push({eingriff:eingriffKey,rolle:rolle});
  };

  Object.keys(OP_STEUERUNG).forEach(k=>{
    const e=OP_STEUERUNG[k];
    if(e.hebel){
      // hebel kann "A" oder "A + B" sein
      e.hebel.split(/\s*\+\s*/).forEach(c=>add(c,k,"Hebel"));
    }
    if(e.kontext)e.kontext.forEach(o=>add(o.code,k,"Kontextprozedur"));
    if(e.kontextExcluded)e.kontextExcluded.forEach(o=>add(o.code,k,"nicht als Kontext wirksam"));
    if(e.hdrgTrigger)e.hdrgTrigger.forEach(o=>add(o.code,k,"H-DRG-Trigger"));
    if(e.aufwertung&&e.aufwertung.triggers)e.aufwertung.triggers.forEach(o=>add(o.code,k,"Aufwertung"));
    if(e.ausschluss&&e.ausschluss.triggers)e.ausschluss.triggers.forEach(o=>add(o.code,k,"Ausschluss H-DRG"));
  });

  const rows=Object.values(usage).sort((a,b)=>a.code.localeCompare(b.code));
  const q=filter.toLowerCase();
  const filtered=q?rows.filter(r=>r.code.toLowerCase().includes(q)||(r.label||"").toLowerCase().includes(q)||r.uses.some(u=>u.eingriff.toLowerCase().includes(q)||u.rolle.toLowerCase().includes(q))):rows;

  const labelOnly=Object.keys(OPS_LABELS).filter(c=>!usage[c]).sort();

  const roleColor=r=>r==="Hebel"?"#2E7D32":r==="Kontextprozedur"?"#1565C0":r==="H-DRG-Trigger"?"#00695C":r==="Aufwertung"?"#2E7D32":r==="Ausschluss H-DRG"?"#C62828":r==="nicht als Kontext wirksam"?"#C62828":"#718096";

  return <div style={{padding:"16px 20px"}}>
    <div style={{marginBottom:14,fontSize:11,color:"#555",lineHeight:1.5}}>
      Einzige Quelle der OPS-Code-Bezeichnungen: die zentrale Bibliothek <b>OPS_LABELS</b>. Wird hier eine Bezeichnung geändert, ändert sie sich überall im Tool.
    </div>
    <input value={filter} onChange={e=>setFilter(e.target.value)} placeholder="Filter: Code, Bezeichnung, Eingriff, Rolle …" style={{width:"100%",padding:"8px 10px",border:"1px solid rgba(0,0,0,.12)",borderRadius:6,fontSize:11,marginBottom:12,boxSizing:"border-box",fontFamily:"inherit"}}/>
    <div style={{fontSize:10,color:"#718096",marginBottom:6}}>
      {filtered.length} Einträge mit Verwendung · {labelOnly.length} Codes nur in Bibliothek
    </div>
    <div style={{background:"#fff",border:"1px solid rgba(0,0,0,.08)",borderRadius:8,overflow:"hidden"}}>
      <div style={{display:"grid",gridTemplateColumns:"120px 1fr 1fr 100px",background:"#F5F7FA",padding:"8px 10px",fontSize:10,fontWeight:700,color:"#2D3748",borderBottom:"1px solid rgba(0,0,0,.08)"}}>
        <div>Code</div><div>Bezeichnung</div><div>Verwendung (Eingriff · Rolle)</div><div>Status</div>
      </div>
      {filtered.map(r=><div key={r.code} style={{display:"grid",gridTemplateColumns:"120px 1fr 1fr 100px",padding:"8px 10px",fontSize:10,borderBottom:"1px solid rgba(0,0,0,.05)",alignItems:"start"}}>
        <div style={{fontFamily:"monospace",fontWeight:600,color:"#2D3748"}}>{r.code}</div>
        <div style={{color:r.nichtInBib?"#C62828":"#2D3748",fontStyle:r.nichtInBib?"italic":"normal"}}>{r.label||"— nicht in Bibliothek —"}</div>
        <div>
          {r.uses.map((u,i)=><div key={i} style={{marginBottom:2}}>
            <span style={{color:"#4A5568"}}>{u.eingriff}</span> · <span style={{color:roleColor(u.rolle),fontWeight:600}}>{u.rolle}</span>
          </div>)}
        </div>
        <div style={{fontSize:10,color:r.nichtInBib?"#C62828":"#2E7D32",fontWeight:600}}>{r.nichtInBib?"⚠ nicht in OPS_LABELS":"✓ zentral"}</div>
      </div>)}
    </div>
    {labelOnly.length>0&&<details style={{marginTop:16}}>
      <summary style={{cursor:"pointer",fontSize:11,fontWeight:600,color:"#006B6F",padding:"6px 0"}}>{labelOnly.length} weitere Codes in der Bibliothek ohne Verwendung in OP_STEUERUNG</summary>
      <div style={{background:"#F5F7FA",borderRadius:6,padding:10,marginTop:4,fontSize:10,color:"#718096"}}>
        {labelOnly.map(c=><div key={c} style={{marginBottom:2}}><span style={{fontFamily:"monospace",fontWeight:600,color:"#2D3748"}}>{c}</span> — {OPS_LABELS[c]}</div>)}
      </div>
    </details>}
  </div>;
}

function AufklaerungstoolView() {
  const D = AUFKLAERUNG_RISIKEN;
  const [sel, setSel] = React.useState([]);
  const [copied, setCopied] = React.useState(false);
  const [such, setSuch] = React.useState("");

  // Eingriffe nach Kontext gruppieren für die Auswahl
  const kontextNamen = {
    hallux_valgus: "Hallux valgus / Vorfuß",
    hallux_rigidus: "Hallux rigidus",
    metatarsalgie_morton: "Metatarsalgie / Morton",
    osg_arthrose: "OSG-Arthrose / Knorpel",
    osg_instabil: "OSG-Instabilität / Bandchirurgie",
    plattfuss_rueckfuss: "Plattfuß / Rückfuß",
    achilles_haglund: "Achillessehne / Haglund",
    plantarfasziitis: "Plantarfasziitis"
  };
  const gruppiert = {};
  Object.keys(D.eingriffe).forEach(function(k){
    var kx = D.eingriffe[k].kontext;
    if(!gruppiert[kx]) gruppiert[kx]=[];
    gruppiert[kx].push(k);
  });

  function tog(k){
    setCopied(false);
    setSel(function(prev){
      return prev.indexOf(k)>=0 ? prev.filter(function(x){return x!==k;}) : prev.concat([k]);
    });
  }

  // Text generieren mit Dedupe
  function buildText(){
    if(sel.length===0) return "";
    var out = [];
    // 1. Allgemein-Block (einmal)
    out.push("Allgemeine Risiken:");
    out.push(D.allgemein.join(", ") + ".");
    out.push("");
    // 2. Spezifische Risiken (zusammengeführt, dedupliziert)
    var spezSeen = {};

    sel.forEach(function(k){

      (D.gruppen[g]||[]).forEach(function(r){

      });
    });
    out.push("Spezifische Risiken:");
    out.push(spez.join(", ") + ".");
    out.push("");
    // 3. Teil A - Elektiv
    out.push(D.elektiv);
    out.push("");
    // 4. Teil B - Alternativen (Kontexte der gewählten Eingriffe, gewählte herausgefiltert)
    var konsSeen={}, kons=[], opSeen={}, opAlt=[];

    out.push("");
    // 5. Abschluss
    out.push("Es bestehen keine weiteren Fragen.");
    return out.join("\n");
  }

function preisExcelEinlesen(datei, fertig){
  var X = window.XLSX;
  if (!X) { fertig("Excel-Bibliothek nicht geladen"); return; }
  var leser = new FileReader();
  leser.onload = function(ev){
    try {
      var wb = X.read(new Uint8Array(ev.target.result), {type:"array"});
      var wsP = wb.Sheets["Meine Preise"], wsE = wb.Sheets["Eingriffe"];
      if (!wsP) { fertig("Blatt „Meine Preise“ fehlt — bitte die Vorlage aus der App verwenden."); return; }
      // --- Preise ---
      // Struktur-Zeilen der Vorlage sind keine Implantate. Erkennung strukturell:
      // Die Vorlage schreibt Abschnitts- und Hinweiszeilen ausschliesslich in
      // Spalte A und laesst Hersteller, Artikelnummer, Preis und ID leer. Eine
      // echte Position hat immer mindestens eines dieser vier Felder gefuellt.
      function istStrukturzeile(r){
        var bez = String(r["Implantat"] == null ? "" : r["Implantat"]).trim();
        if (!bez) return true;                                  // voellig leere Zeile
        var nurSpalteA = !r["Implantat-ID"] && !r["Hersteller"] && !r["Artikelnummer"]
                      && (r["Einzelpreis (\u20ac)"] === undefined || r["Einzelpreis (\u20ac)"] === "");
        if (!nurSpalteA) return false;         // echte Position, evtl. noch ohne Preis
        return /^(ABSCHNITT\b|Eigene Positionen k\u00f6nnen Sie)/i.test(bez);
      }
      var strukturzeilen = 0;
      var preise = X.utils.sheet_to_json(wsP).filter(function(r){
        if (istStrukturzeile(r)) { if (String(r["Implantat"]||"").trim()) strukturzeilen++; return false; }
        return true;
      });
      var nachName = {};
      Object.keys(_ZUORD.KATALOG).forEach(function(id){ nachName[_ZUORD.KATALOG[id].bezeichnung.toLowerCase()] = id; });
      Object.keys(window._PREISE||{}).forEach(function(id){
        var b=(window._PREISE[id].bezeichnung||"").toLowerCase(); if(b) nachName[b]=id; });
      var uebernommen=0, ohnePreis=0, eigene=0, unklar=[];
      preise.forEach(function(r){
        var id = r["Implantat-ID"] || nachName[String(r["Implantat"]).trim().toLowerCase()];
        if (!id) { id = "eigen_" + String(r["Implantat"]).toLowerCase().replace(/[^a-z0-9]+/g,"_").slice(0,40); eigene++; }
        var roh = r["Einzelpreis (€)"];
        var preis = (roh===undefined||roh==="") ? null : Number(String(roh).replace(",", "."));
        if (preis == null) ohnePreis++; else uebernommen++;
        preisSpeichern(id, {bezeichnung:String(r["Implantat"]).trim(), hersteller:r["Hersteller"]||"",
          artikelnummer:r["Artikelnummer"]||"", preis: isFinite(preis)?preis:null,
          eigene: !_ZUORD.KATALOG[id]});
      });
      // --- Materialsätze ---
      var saetze = {}, fehlendeEingriffe = [];
      if (wsE) {
        X.utils.sheet_to_json(wsE, {range:1}).forEach(function(r){
          var eg = r["Eingriff-ID"], im = r["Implantat-ID"];
          if (!eg || !im) return;
          var va = (r["Variante"] || "Standard").toString().trim() || "Standard";
          var s = saetze[eg] || (saetze[eg] = {});
          (s[va] || (s[va] = [])).push({implantat_id: im, anzahl: parseInt(r["Anzahl"]||"1",10)});
        });
        Object.keys(_ZUORD.EINGRIFFE).forEach(function(eg){ if(!saetze[eg]) fehlendeEingriffe.push(_ZUORD.EINGRIFFE[eg].name); });
        Object.keys(saetze).forEach(function(eg){ Object.keys(saetze[eg]).forEach(function(va){
          materialsatzSpeichern(eg, va, saetze[eg][va]); }); });
      }
      var text = uebernommen+" Positionen mit Preis übernommen";
      if (ohnePreis) text += ", "+ohnePreis+" ohne Preis";
      if (eigene) text += ", "+eigene+" eigene Position"+(eigene>1?"en":"");
      if (fehlendeEingriffe.length) text += " · "+fehlendeEingriffe.length+" Eingriff"+(fehlendeEingriffe.length>1?"e":"")+" nicht in der Datei — bisheriger Materialsatz bleibt erhalten";
      if (strukturzeilen) text += " · "+strukturzeilen+" Überschriftszeile"+(strukturzeilen>1?"n":"")+" der Vorlage übersprungen";
      fertig(text);
    } catch(e){ fertig("Datei konnte nicht gelesen werden: "+(e&&e.message?e.message:e)); }
  };
  leser.readAsArrayBuffer(datei);

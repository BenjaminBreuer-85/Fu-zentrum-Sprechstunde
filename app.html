// IMPLANTATPREISE — Kontoeigene Preisliste und Materialsätze
// ============================================================================
const PREIS_SEKTIONEN = ["Vorfuß","Rückfuß","OSG","OSG-Prothese","Unfallchirurgie"];

// Preisliste in der Form, die der Excel-Export erwartet — wird auch aus den
// Einstellungen heraus gebraucht, wo die Kachel nicht geöffnet ist.
function preislisteFuerExport(){
  var ids = new Set([...Object.keys(_ZUORD.KATALOG), ...Object.keys(window._PREISE||{})]);
  return [...ids].map(function(id){
    var e = (window._PREISE||{})[id] || {};
    return {id:id, bezeichnung: implantatBezeichnung(id), hersteller: e.hersteller || "",
      artikelnummer: e.artikelnummer || "", preis: implantatStueckpreis(id),
      sektion: implantatSektion(id), eigene: istEigenePosition(id),
      aktualisiert: e.aktualisiert || null, verwendung: verwendungVon(id)};
  });
}
// Anzeigename eines Eingriffs. Sieben Namen kommen mehrfach vor und sind nur
// ueber die Variante unterscheidbar ("OSG-TEP Mobile Bearing" gibt es als
// "Flat Cut" und "kurviert") — deshalb haengen wir sie ueberall dort an, wo
// der Eingriff ohne eigene Variantenspalte erscheint.
function eingriffAnzeige(name, variante){
  return (!variante || variante === "Standard") ? name : name + " · " + variante;
}
// Wo wird ein Implantat verwendet? → [{eingriffId, name, variante, anzahl}]
function verwendungVon(id){
  var out = [];
  Object.keys(_ZUORD.EINGRIFFE).forEach(function(eg){
    var e = _ZUORD.EINGRIFFE[eg];
    Object.keys(e.varianten).forEach(function(v){
      materialsatzPositionen(eg, v).forEach(function(pos){
        if (pos.implantat_id === id)
          out.push({eingriffId:eg, name:e.name, anzeige:eingriffAnzeige(e.name, v),
                    variante:v, sektion:e.sektion, anzahl:pos.anzahl});
      });
    });
  });
  return out;
}
// Alle Eingriffe mit Positionen, Summen und Vollständigkeit
function alleEingriffe(){
  var out = [];
  Object.keys(_ZUORD.EINGRIFFE).forEach(function(eg){
    var e = _ZUORD.EINGRIFFE[eg];
    Object.keys(e.varianten).forEach(function(v){
      var pos = MATPOS(eg, v);
      var fehlend = pos.filter(function(x){ return x.preis == null; });
      out.push({eingriffId:eg, name:e.name, anzeige:eingriffAnzeige(e.name, v),
        sektion:e.sektion, variante:v, positionen:pos,
        summe: pos.reduce(function(s,x){ return s + (x.preis||0); }, 0),
        fehlend: fehlend.length, fehlendeIds: fehlend.map(function(x){ return x.implantat_id; })});
    });
  });
  return out.sort(function(a,b){
    var sa = PREIS_SEKTIONEN.indexOf(a.sektion), sb = PREIS_SEKTIONEN.indexOf(b.sektion);
    if (sa !== sb) return (sa<0?99:sa) - (sb<0?99:sb);
    return a.name < b.name ? -1 : a.name > b.name ? 1 : 0;
  });
}

function ImplantatpreiseView(){
  const [tick, setTick] = React.useState(0);          // erzwingt Neuberechnung
  const [ansicht, setAnsicht] = React.useState("implantate");
  const [suche, setSuche] = React.useState("");
  const [sektion, setSektion] = React.useState("");
  const [sortierung, setSortierung] = React.useState("name");
  const [offen, setOffen] = React.useState({});        // aufgeklappte Verwendung
  const [zurueckZu, setZurueckZu] = React.useState(null); // Zustand vor einem Sprung aus der Statuszeile
  const [fehlendeOffen, setFehlendeOffen] = React.useState(false); // Chips im Statuskasten
  // Sprung zu einer bestimmten Position — vorherigen Zustand sichern
  function springeZu(implantatId){
    setZurueckZu({ansicht:ansicht, suche:suche, sektion:sektion, sortierung:sortierung,
                  scroll: window.scrollY || 0});
    setAnsicht("implantate"); setSektion(""); setSuche(implantatBezeichnung(implantatId));
    window.scrollTo({top:0, behavior:"smooth"});
  }
  function zurueckZurUebersicht(){
    if (!zurueckZu) return;
    setAnsicht(zurueckZu.ansicht); setSuche(zurueckZu.suche);
    setSektion(zurueckZu.sektion); setSortierung(zurueckZu.sortierung);
    var y = zurueckZu.scroll;
    setZurueckZu(null);
    setTimeout(function(){ window.scrollTo({top:y, behavior:"auto"}); }, 30);
  }
  const [bearbeite, setBearbeite] = React.useState(null);  // {id, wert}
  const [anlegen, setAnlegen] = React.useState(null);      // Formular „Implantat anlegen“
  const [posSuche, setPosSuche] = React.useState({});      // Suchtext je Eingriff
  const [posNeu, setPosNeu] = React.useState({});          // Neuanlage aus dem Eingriff heraus
  const [ersetzen, setErsetzen] = React.useState(null);    // {vonId, suche, zielId, neuPreis, schritt}
  const [meldung, setMeldung] = React.useState("");
  const dateiRef = React.useRef(null);

  React.useEffect(function(){ window._onPreiseGeladen = function(){ setTick(function(x){return x+1;}); };
    return function(){ window._onPreiseGeladen = null; }; }, []);
  const neuBerechnen = () => setTick(function(x){ return x+1; });

  // --- Datenbasis ---
  const eingriffe = React.useMemo(function(){ return alleEingriffe(); }, [tick]);
  const implantate = React.useMemo(function(){
    var ids = new Set([...Object.keys(_ZUORD.KATALOG), ...Object.keys(window._PREISE||{})]);
    return [...ids].map(function(id){
      var e = (window._PREISE||{})[id] || {};
      return {id:id, bezeichnung: implantatBezeichnung(id), hersteller: e.hersteller || "",
        artikelnummer: e.artikelnummer || "", preis: implantatStueckpreis(id),
        sektion: implantatSektion(id), eigene: istEigenePosition(id),
        aktualisiert: e.aktualisiert || null, verwendung: verwendungVon(id)};
    });
  }, [tick]);

  const hatPreise = implantate.some(function(i){ return i.preis != null; });
  const status = React.useMemo(function(){
    return {gesamt: eingriffe.length,
            vollstaendig: eingriffe.filter(function(e){ return e.positionen.length && !e.fehlend; }).length,
            unvollstaendig: eingriffe.filter(function(e){ return e.fehlend > 0; })};
  }, [eingriffe]);

  // --- Filter + Sortierung ---
  const q = suche.trim().toLowerCase();
  const gefiltert = React.useMemo(function(){
    var l = implantate.filter(function(i){
      if (q && !((i.bezeichnung+" "+i.hersteller+" "+i.artikelnummer).toLowerCase().includes(q))) return false;
      // Eine selbst angelegte Position hat noch keine Verwendung — dann zaehlt
      // die bei der Anlage gewaehlte Sektion.
      if (sektion && i.sektion !== sektion
          && !i.verwendung.some(function(v){ return v.sektion === sektion; })) return false;
      return true;
    });
    l.sort(function(a,b){
      if (sortierung === "preis") return (b.preis||0) - (a.preis||0);
      return a.bezeichnung.localeCompare(b.bezeichnung, "de");
    });
    return l;
  }, [implantate, q, sektion, sortierung]);
  const maxPreis = Math.max.apply(null, [1].concat(gefiltert.map(function(i){ return i.preis||0; })));

  const eingriffeGefiltert = React.useMemo(function(){
    return eingriffe.filter(function(e){
      if (sektion && e.sektion !== sektion) return false;
      if (!q) return true;
      return e.name.toLowerCase().includes(q) ||
             e.positionen.some(function(p){ return implantatBezeichnung(p.implantat_id).toLowerCase().includes(q); });
    });
  }, [eingriffe, q, sektion]);

  // --- Inline speichern ---
  function preisUebernehmen(id, roh){
    var wert = String(roh).replace(",", ".").trim();
    var zahl = wert === "" ? null : Number(wert);
    if (wert !== "" && !isFinite(zahl)) { setBearbeite(null); return; }
    preisSpeichern(id, {preis: zahl}).then(function(){
      setBearbeite(null); neuBerechnen();
      var n = verwendungVon(id).length;
      setMeldung("Preis gespeichert" + (n ? " — " + n + " Eingriff" + (n>1?"e":"") + " neu berechnet" : ""));
      setTimeout(function(){ setMeldung(""); }, 3500);
    });
  }
  // Eine Position aus dem Materialsatz nehmen — mit Rückfrage, weil auch das am
  // Telefon schnell danebengeht. Der Bestand bleibt davon unberührt.
  function positionEntfernen(e, index, pos){
    var name = implantatBezeichnung(pos.implantat_id);
    if (!window.confirm("„"+name+"“ aus „"+e.anzeige+"“ entfernen?\n\n"
      +"Die Position bleibt in Ihrer Preisliste erhalten und lässt sich jederzeit "
      +"wieder hinzufügen.")) return;
    var neu = materialsatzPositionen(e.eingriffId, e.variante)
      .map(function(x){ return {implantat_id:x.implantat_id, anzahl:x.anzahl}; });
    neu.splice(index, 1);
    materialsatzSpeichern(e.eingriffId, e.variante, neu).then(function(){
      neuBerechnen(); setMeldung("„"+name+"“ aus „"+e.anzeige+"“ entfernt.");
      setTimeout(function(){ setMeldung(""); }, 3000);
    });
  }
  function mengeUebernehmen(eingriffId, variante, index, neueAnzahl){
    var pos = materialsatzPositionen(eingriffId, variante).map(function(p){ return {implantat_id:p.implantat_id, anzahl:p.anzahl}; });
    if (neueAnzahl <= 0) pos.splice(index, 1); else pos[index].anzahl = neueAnzahl;
    materialsatzSpeichern(eingriffId, variante, pos).then(function(){
      neuBerechnen(); setMeldung("Materialsatz gespeichert"); setTimeout(function(){ setMeldung(""); }, 3000);
    });
  }

  // --- Eigene Position anlegen ---------------------------------------------
  const LEER_FORM = {bezeichnung:"", hersteller:"", artikelnummer:"", preis:"", sektion:PREIS_SEKTIONEN[0]};
  function neueImplantatId(bez){
    var basis = "eigen_" + bez.toLowerCase()
      .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
      .replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"").slice(0,40);
    if (basis === "eigen_") basis = "eigen_position";
    var id = basis, n = 2;
    while (_ZUORD.KATALOG[id] || (window._PREISE||{})[id]) id = basis + "_" + (n++);
    return id;
  }
  function anlegenSpeichern(){
    var f = anlegen, bez = (f.bezeichnung||"").trim();
    if (!bez) { setMeldung("Bitte eine Bezeichnung eintragen."); return; }
    var preis = String(f.preis).replace(",", ".").trim();
    if (preis === "" || !isFinite(Number(preis))) { setMeldung("Bitte einen Einzelpreis eintragen."); return; }
    // Keine zwei Positionen duerfen gleich heissen
    var doppelt = implantate.some(function(i){
      return i.bezeichnung.trim().toLowerCase() === bez.toLowerCase(); });
    if (doppelt) { setMeldung("„"+bez+"“ gibt es bereits — bitte eine unterscheidbare Bezeichnung wählen."); return; }
    var id = neueImplantatId(bez);
    preisSpeichern(id, {bezeichnung:bez, hersteller:(f.hersteller||"").trim(),
      artikelnummer:(f.artikelnummer||"").trim(), preis:Number(preis),
      sektion:f.sektion || "", eigene:true}).then(function(){
      setAnlegen(null); neuBerechnen();
      setMeldung("„"+bez+"“ angelegt — ab sofort in den Materialsätzen wählbar.");
      setTimeout(function(){ setMeldung(""); }, 4000);
    });
  }
  // Löschen ist unwiderruflich und am Telefon einen Fehltipp entfernt — deshalb
  // wird IMMER nachgefragt. Wird die Position verwendet, nennt die Rückfrage die
  // betroffenen Eingriffe namentlich, nicht nur ihre Anzahl.
  function positionLoeschen(i){
    var frage;
    if (i.verwendung.length) {
      var liste = i.verwendung.map(function(v){ return "  • " + v.anzahl + "× " + v.anzeige; }).join("\n");
      frage = "„"+i.bezeichnung+"“ wird in "+i.verwendung.length+" Eingriff"
        +(i.verwendung.length>1?"en":"")+" verwendet:\n\n"+liste
        +"\n\nWirklich löschen? Die Position verschwindet dann auch aus diesen Materialsätzen.";
    } else {
      frage = "„"+i.bezeichnung+"“ endgültig aus Ihrem Bestand löschen?\n\n"
        +"Die Position wird in keinem Eingriff verwendet. Rückgängig machen lässt sich das nicht.";
    }
    if (!window.confirm(frage)) return;
    preisLoeschen(i.id).then(function(){
      neuBerechnen(); setMeldung("„"+i.bezeichnung+"“ gelöscht.");
      setTimeout(function(){ setMeldung(""); }, 3000);
    });
  }
  // --- Bestand durchsuchen (ein Bestand, zwei Wege) -------------------------
  // Implantate existieren genau einmal. Der Materialsatz verweist nur darauf,
  // deshalb sucht das Feld im selben Bestand, den die Ansicht „Implantate“ zeigt.
  function bestandSuchen(text, schonEnthalten){
    var s = String(text||"").trim().toLowerCase();
    if (!s) return [];
    return implantate.filter(function(i){
      if (schonEnthalten.indexOf(i.id) >= 0) return false;
      return (i.bezeichnung+" "+i.hersteller+" "+i.artikelnummer).toLowerCase().indexOf(s) >= 0;
    }).sort(function(a,b){ return a.bezeichnung.localeCompare(b.bezeichnung,"de"); }).slice(0, 8);
  }
  // --- Position zu einem Materialsatz hinzufuegen ---------------------------
  // Hinzufuegen ergaenzt immer, es ersetzt nie eine vorhandene Zeile.
  function positionHinzufuegen(e, id){
    var key = e.eingriffId + "|" + e.variante;
    if (!id) return;
    var pos = materialsatzPositionen(e.eingriffId, e.variante).map(function(x){
      return {implantat_id:x.implantat_id, anzahl:x.anzahl}; });
    if (pos.some(function(x){ return x.implantat_id === id; })) {
      setMeldung(implantatBezeichnung(id)+" ist in diesem Eingriff bereits enthalten.");
      setTimeout(function(){ setMeldung(""); }, 3000); return;
    }
    pos.push({implantat_id:id, anzahl:1});
    materialsatzSpeichern(e.eingriffId, e.variante, pos).then(function(){
      setPosSuche(Object.assign({}, posSuche, {[key]:""}));
      setPosNeu(Object.assign({}, posNeu, {[key]:null}));
      neuBerechnen(); setMeldung(implantatBezeichnung(id)+" zu „"+e.anzeige+"“ hinzugefügt.");
      setTimeout(function(){ setMeldung(""); }, 3000);
    });
  }
  // Neues Implantat direkt aus dem Eingriff heraus: erst in den Bestand, dann
  // in den Materialsatz — damit es anschliessend ueberall auffindbar ist.
  function posNeuAnlegen(e){
    var key = e.eingriffId + "|" + e.variante, f = posNeu[key];
    if (!f) return;
    var bez = (f.bezeichnung||"").trim();
    var preis = String(f.preis).replace(",", ".").trim();
    if (!bez) { setMeldung("Bitte eine Bezeichnung eintragen."); return; }
    if (preis === "" || !isFinite(Number(preis))) { setMeldung("Bitte einen Einzelpreis eintragen."); return; }
    if (implantate.some(function(i){ return i.bezeichnung.trim().toLowerCase() === bez.toLowerCase(); })) {
      setMeldung("„"+bez+"“ gibt es bereits im Bestand — bitte aus der Liste wählen."); return;
    }
    var id = neueImplantatId(bez);
    preisSpeichern(id, {bezeichnung:bez, preis:Number(preis), sektion:e.sektion, eigene:true})
      .then(function(){ positionHinzufuegen(e, id); });
  }

  // --- Ersetzen: ein Implantat in ALLEN Materialsaetzen austauschen ----------
  // Mengen bleiben erhalten. Enthaelt ein Eingriff altes und neues Implantat,
  // werden die Mengen addiert statt eine Zeile stillschweigend zu verlieren.
  function ersetzenBetroffen(vonId, zielId){
    var out = [];
    Object.keys(_ZUORD.EINGRIFFE).forEach(function(eg){
      var e = _ZUORD.EINGRIFFE[eg];
      Object.keys(e.varianten).forEach(function(v){
        var pos = materialsatzPositionen(eg, v);
        var treffer = pos.filter(function(x){ return x.implantat_id === vonId; });
        if (!treffer.length) return;
        out.push({eingriffId:eg, variante:v, anzeige:eingriffAnzeige(e.name, v),
          anzahl: treffer.reduce(function(s,x){ return s + x.anzahl; }, 0),
          kollision: !!zielId && pos.some(function(x){ return x.implantat_id === zielId; })});
      });
    });
    return out;
  }
  function ersetzenAusfuehren(vonId, zielId){
    var betroffen = ersetzenBetroffen(vonId, zielId);
    return Promise.all(betroffen.map(function(b){
      var pos = materialsatzPositionen(b.eingriffId, b.variante);
      var neu = [], platz = {};
      pos.forEach(function(x){
        var id = x.implantat_id === vonId ? zielId : x.implantat_id;
        if (platz[id] !== undefined) neu[platz[id]].anzahl += x.anzahl;   // Mengen addieren
        else { platz[id] = neu.length; neu.push({implantat_id:id, anzahl:x.anzahl}); }
      });
      return materialsatzSpeichern(b.eingriffId, b.variante, neu);
    })).then(function(){ return betroffen.length; });
  }
  function ersetzenStarten(id){
    setErsetzen({vonId:id, suche:"", zielId:"", neuBezeichnung:"", neuPreis:"", schritt:"waehlen", anzahl:0});
  }
  function ersetzenZielWaehlen(zielId, bezeichnung){
    setErsetzen(Object.assign({}, ersetzen, {zielId:zielId, zielName:bezeichnung, schritt:"bestaetigen"}));
  }
  // Ziel neu anlegen und danach ersetzen
  function ersetzenZielNeu(){
    var bez = (ersetzen.suche||"").trim();
    var preis = String(ersetzen.neuPreis).replace(",", ".").trim();
    if (!bez) { setMeldung("Bitte eine Bezeichnung eintragen."); return; }
    if (preis === "" || !isFinite(Number(preis))) { setMeldung("Bitte einen Einzelpreis eintragen."); return; }
    if (implantate.some(function(i){ return i.bezeichnung.trim().toLowerCase() === bez.toLowerCase(); })) {
      setMeldung("„"+bez+"“ gibt es bereits im Bestand — bitte aus der Liste wählen."); return;
    }
    var id = neueImplantatId(bez);
    var alt = implantate.filter(function(i){ return i.id === ersetzen.vonId; })[0] || {};
    preisSpeichern(id, {bezeichnung:bez, preis:Number(preis), sektion:alt.sektion||"", eigene:true})
      .then(function(){ neuBerechnen(); ersetzenZielWaehlen(id, bez); });
  }
  function ersetzenBestaetigen(){
    var von = ersetzen.vonId, ziel = ersetzen.zielId;
    var altName = implantatBezeichnung(von), zielName = implantatBezeichnung(ziel);
    ersetzenAusfuehren(von, ziel).then(function(n){
      neuBerechnen();
      setMeldung(altName+" in "+n+" Eingriff"+(n>1?"en":"")+" durch "+zielName+" ersetzt.");
      setErsetzen(Object.assign({}, ersetzen, {schritt:"loeschfrage", ersetzteAnzahl:n}));
    });
  }
  function ersetzenAltLoeschen(loeschen){
    if (!loeschen) { setErsetzen(null); setMeldung(""); return; }
    var von = ersetzen.vonId, name = implantatBezeichnung(von);
    preisLoeschen(von).then(function(){
      setErsetzen(null); neuBerechnen();
      setMeldung("„"+name+"“ aus dem Bestand gelöscht.");
      setTimeout(function(){ setMeldung(""); }, 3500);
    });
  }

  // --- Export / Import ---
  function exportieren(){
    if (!window.XLSX) { setMeldung("Excel-Bibliothek nicht geladen"); return; }
    preisExcelBauen(implantate, eingriffe);
  }
  function dateiGewaehlt(ev){
    var f = ev.target.files && ev.target.files[0];
    if (f) preisExcelEinlesen(f, function(text){ setMeldung(text); neuBerechnen(); });
    ev.target.value = "";
  }

  const P = "#10535B", TINT = "#E6F0F1", AMBER = "#8A5A00", AMBERBG = "#FBF3DF", LINIE = "#D6E2E3";
  const btn = (aktiv) => ({padding:"6px 14px",borderRadius:8,fontSize:12,fontWeight:600,cursor:"pointer",
    border:"1px solid "+(aktiv?P:LINIE), background: aktiv?P:"#fff", color: aktiv?"#fff":"#5C6660"});
  const feld = {width:"100%",marginTop:3,padding:"7px 9px",fontSize:12,color:"#1D2421",
    border:"1px solid "+LINIE,borderRadius:7,boxSizing:"border-box"};

  // ------------------------------------------------- Konto noch nicht geladen
  // Erst rechnen, wenn der Abruf vollstaendig und erfolgreich war. Ein leeres
  // Ergebnis sieht sonst aus wie "fast nichts bepreist".
  const kontoStatus = window._SB ? (window._KONTO_STATUS || "laedt") : "ok";
  if (kontoStatus === "laedt") {
    return <div style={{maxWidth:760,margin:"0 auto",padding:"8px 4px"}}>
      <div style={{background:"#fff",border:"1px solid "+LINIE,borderRadius:12,
          padding:"30px 24px",textAlign:"center"}}>
        <div style={{fontSize:13,color:"#5C6660"}}>Ihre Preisliste wird geladen …</div>
      </div>
    </div>;
  }
  if (kontoStatus === "fehler") {
    return <div style={{maxWidth:760,margin:"0 auto",padding:"8px 4px"}}>
      <div style={{background:AMBERBG,border:"1px solid "+AMBER,borderRadius:12,padding:"26px 24px"}}>
        <div style={{fontSize:16,fontWeight:700,color:AMBER,marginBottom:8}}>
          Ihre Preisliste konnte nicht geladen werden</div>
        <div style={{fontSize:13,color:"#1D2421",lineHeight:1.65,marginBottom:16}}>
          Bitte laden Sie die Seite neu oder melden Sie sich erneut an. Es werden
          bewusst keine Zahlen angezeigt, solange die Daten unvollständig sind —
          eine halbe Preisliste ergäbe falsche Summen.
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <span onClick={()=>location.reload()} style={btn(true)}>Neu laden</span>
          <span onClick={()=>{ if(window._SITZUNG_BEENDET && window._SB)
              window._SITZUNG_BEENDET(window._SB, "Bitte melden Sie sich erneut an."); }}
            style={btn(false)}>Neu anmelden</span>
        </div>
        {window._KONTO_FEHLER && <div style={{marginTop:12,fontSize:11,color:"#5C6660"}}>
          Technische Meldung: {window._KONTO_FEHLER}</div>}
      </div>
    </div>;
  }

  // ---------------------------------------------------------------- Leerzustand
  if (!hatPreise) {
    return <div style={{maxWidth:760,margin:"0 auto",padding:"8px 4px"}}>
      <div style={{background:"#fff",border:"1px solid "+LINIE,borderRadius:12,padding:"26px 24px",textAlign:"center"}}>
        <div style={{fontSize:38,marginBottom:8}}>💶</div>
        <div style={{fontSize:17,fontWeight:700,color:P,marginBottom:6}}>Noch keine Preisliste hinterlegt</div>
        <div style={{fontSize:13,color:"#5C6660",lineHeight:1.6,maxWidth:520,margin:"0 auto 20px"}}>
          Implantatpreise sind vertraulich und gehören Ihrem Konto. Laden Sie die Vorlage herunter,
          tragen Sie Ihre Einkaufspreise ein und laden Sie die Datei wieder hoch. Danach berechnen
          Sprechstundenbrief und OP-Bericht Ihre Materialkosten und Deckungsbeiträge.
        </div>
        <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap",marginBottom:18}}>
          <div data-tour="preis-export" onClick={exportieren} style={Object.assign({},btn(true))}>1 · Vorlage herunterladen</div>
          <div data-tour="preis-upload" onClick={()=>dateiRef.current&&dateiRef.current.click()} style={Object.assign({},btn(false))}>2 · Ausgefüllte Datei hochladen</div>
        </div>
        <input ref={dateiRef} type="file" accept=".xlsx" onChange={dateiGewaehlt} style={{display:"none"}}/>
        {meldung && <div style={{marginTop:12,fontSize:12,color:AMBER}}>{meldung}</div>}
      </div>
    </div>;
  }

  // ---------------------------------------------------------------- Hauptansicht
  return <div style={{maxWidth:980,margin:"0 auto",padding:"4px 4px 30px"}}>
    {/* Statuszeile */}
    <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:12}}>
      <div style={{flex:"1 1 240px",background:"#fff",border:"1px solid "+LINIE,borderRadius:10,padding:"10px 14px"}}>
        <div style={{fontSize:20,fontWeight:700,color: status.vollstaendig===status.gesamt ? "#2E7D32" : P}}>
          {status.vollstaendig}<span style={{fontSize:13,fontWeight:400,color:"#5C6660"}}> von </span>{status.gesamt}
        </div>
        <div style={{fontSize:11,color:"#5C6660"}}>Eingriffen vollständig bepreist</div>
      </div>
      {status.unvollstaendig.length>0 && <div style={{flex:"1 1 190px",background:AMBERBG,
          border:"1px solid "+AMBER,borderRadius:10,padding:"10px 14px"}}>
        <div onClick={()=>setFehlendeOffen(!fehlendeOffen)} role="button"
             title={fehlendeOffen?"Liste einklappen":"Betroffene Eingriffe anzeigen"}
             style={{cursor:"pointer",display:"flex",alignItems:"baseline",gap:8}}>
          <div style={{fontSize:20,fontWeight:700,color:AMBER}}>{status.unvollstaendig.length}</div>
          <div style={{fontSize:11,color:"#5C6660",flex:1}}>ohne hinterlegten Preis</div>
          <span style={{fontSize:11,color:AMBER}}>{fehlendeOffen?"▴":"▾"}</span>
        </div>
        {fehlendeOffen && <div style={{marginTop:8,display:"flex",gap:5,flexWrap:"wrap"}}>
          {status.unvollstaendig.map(function(e){
            return <span key={e.eingriffId+e.variante} title="zur fehlenden Position springen"
              onClick={()=>springeZu(e.fehlendeIds[0])}
              style={{fontSize:10,padding:"2px 7px",borderRadius:20,background:"#fff",border:"1px solid "+AMBER,
                      color:AMBER,cursor:"pointer"}}>{e.anzeige}</span>;
          })}
        </div>}
      </div>}
    </div>

    {zurueckZu && <div onClick={zurueckZurUebersicht} role="button"
      style={{display:"inline-block",marginBottom:10,fontSize:12,color:P,cursor:"pointer",
              padding:"5px 12px",border:"1px solid "+LINIE,borderRadius:8,background:"#fff"}}>
      ← Implantatpreise
    </div>}

    {/* Umschalter + Werkzeuge */}
    <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",marginBottom:10}}>
      <div onClick={()=>setAnsicht("implantate")} style={btn(ansicht==="implantate")}>Implantate</div>
      <div onClick={()=>setAnsicht("eingriffe")} style={btn(ansicht==="eingriffe")}>Eingriffe</div>
      <div style={{flex:1}}></div>
      {ansicht==="implantate" && <div onClick={()=>setAnlegen(anlegen?null:LEER_FORM)}
        style={Object.assign({},btn(false),{fontSize:11})}>+ Implantat anlegen</div>}
      <div data-tour="preis-export" onClick={exportieren} style={Object.assign({},btn(false),{fontSize:11})}>↓ Als Excel exportieren</div>
      <div data-tour="preis-upload" onClick={()=>dateiRef.current&&dateiRef.current.click()} style={Object.assign({},btn(false),{fontSize:11})}>↑ Datei hochladen</div>
      <input ref={dateiRef} type="file" accept=".xlsx" onChange={dateiGewaehlt} style={{display:"none"}}/>
    </div>

    {/* Suche + Filter */}
    <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
      <input value={suche} onChange={e=>setSuche(e.target.value)}
        placeholder="Suchen — Bezeichnung, Hersteller oder Artikelnummer…"
        style={{flex:"2 1 260px",padding:"8px 10px",fontSize:12,border:"1px solid "+LINIE,borderRadius:8}}/>
      <select value={sektion} onChange={e=>setSektion(e.target.value)}
        style={{flex:"1 1 130px",padding:"8px 10px",fontSize:12,border:"1px solid "+LINIE,borderRadius:8,background:"#fff"}}>
        <option value="">Alle Sektionen</option>
        {PREIS_SEKTIONEN.map(function(s){ return <option key={s} value={s}>{s}</option>; })}
      </select>
      {ansicht==="implantate" && <select value={sortierung} onChange={e=>setSortierung(e.target.value)}
        style={{flex:"1 1 120px",padding:"8px 10px",fontSize:12,border:"1px solid "+LINIE,borderRadius:8,background:"#fff"}}>
        <option value="name">Nach Name</option>
        <option value="preis">Nach Preis</option>
      </select>}
    </div>

    {meldung && <div style={{marginBottom:10,padding:"7px 12px",background:TINT,border:"1px solid "+P,
      borderRadius:8,fontSize:12,color:P}}>{meldung}</div>}


    {/* ---------------- Formular: eigenes Implantat anlegen ---------------- */}
    {anlegen && <div style={{background:"#fff",border:"1px solid "+P,borderRadius:12,
        padding:"14px 16px",marginBottom:12}}>
      <div style={{fontSize:13,fontWeight:700,color:P,marginBottom:4}}>Eigenes Implantat anlegen</div>
      <div style={{fontSize:11,color:"#5C6660",marginBottom:12,lineHeight:1.55}}>
        Für Positionen, die im Standardkatalog fehlen. Sie erscheinen anschließend in Ihrer
        Preisliste, sind in jedem Materialsatz auswählbar und werden beim Excel-Export mit ausgegeben.
      </div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
        <label style={{flex:"2 1 240px",fontSize:11,color:"#5C6660"}}>Bezeichnung *
          <input autoFocus value={anlegen.bezeichnung}
            onChange={ev=>setAnlegen(Object.assign({},anlegen,{bezeichnung:ev.target.value}))}
            onKeyDown={ev=>{ if(ev.key==="Enter") anlegenSpeichern(); if(ev.key==="Escape") setAnlegen(null); }}
            placeholder="z. B. Winkelstabile Platte, 6 Loch"
            style={feld}/></label>
        <label style={{flex:"1 1 150px",fontSize:11,color:"#5C6660"}}>Einzelpreis (€) *
          <input value={anlegen.preis} inputMode="decimal"
            onChange={ev=>setAnlegen(Object.assign({},anlegen,{preis:ev.target.value}))}
            onKeyDown={ev=>{ if(ev.key==="Enter") anlegenSpeichern(); if(ev.key==="Escape") setAnlegen(null); }}
            placeholder="0,00" style={Object.assign({},feld,{textAlign:"right"})}/></label>
      </div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginTop:8}}>
        <label style={{flex:"1 1 160px",fontSize:11,color:"#5C6660"}}>Hersteller
          <input value={anlegen.hersteller}
            onChange={ev=>setAnlegen(Object.assign({},anlegen,{hersteller:ev.target.value}))}
            style={feld}/></label>
        <label style={{flex:"1 1 160px",fontSize:11,color:"#5C6660"}}>Artikelnummer
          <input value={anlegen.artikelnummer}
            onChange={ev=>setAnlegen(Object.assign({},anlegen,{artikelnummer:ev.target.value}))}
            style={feld}/></label>
        <label style={{flex:"1 1 150px",fontSize:11,color:"#5C6660"}}>Sektion
          <select value={anlegen.sektion}
            onChange={ev=>setAnlegen(Object.assign({},anlegen,{sektion:ev.target.value}))}
            style={Object.assign({},feld,{background:"#fff"})}>
            {PREIS_SEKTIONEN.map(function(s){ return <option key={s} value={s}>{s}</option>; })}
          </select></label>
      </div>
      <div style={{display:"flex",gap:8,marginTop:12,alignItems:"center"}}>
        <div onClick={anlegenSpeichern} style={btn(true)}>Anlegen</div>
        <div onClick={()=>setAnlegen(null)} style={btn(false)}>Abbrechen</div>
        <span style={{fontSize:10,color:"#9AA5A0"}}>* Pflichtfeld</span>
      </div>
    </div>}

    {/* ---------------- Ansicht: Implantate ---------------- */}
    {ansicht==="implantate" && <div style={{background:"#fff",border:"1px solid "+LINIE,borderRadius:12,overflow:"hidden"}}>
      {gefiltert.length===0 && <div style={{padding:20,fontSize:12,color:"#5C6660",textAlign:"center"}}>Keine Position gefunden.</div>}
      {gefiltert.map(function(i){
        const anteil = i.preis ? Math.max(2, Math.round(i.preis / maxPreis * 100)) : 0;
        const auf = !!offen[i.id];
        return <div key={i.id} style={{borderBottom:"1px solid "+LINIE,padding:"9px 14px"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <div style={{flex:"1 1 240px",minWidth:0}}>
              <div style={{fontSize:13,fontWeight:600,color:"#1D2421"}}>{i.bezeichnung}
                {i.eigene && <span title="Selbst angelegte Position"
                  style={{marginLeft:6,fontSize:9,fontWeight:600,color:P,background:TINT,
                          padding:"1px 6px",borderRadius:20,verticalAlign:"1px"}}>eigene</span>}</div>
              <div style={{fontSize:10,color:"#5C6660"}}>
                {[i.hersteller, i.artikelnummer].filter(Boolean).join(" · ") || "—"}
                {i.eigene && i.sektion && <span> · {i.sektion}</span>}
                {i.aktualisiert && <span> · Stand {new Date(i.aktualisiert).toLocaleDateString("de-DE")}</span>}
              </div>
            </div>
            <div style={{flex:"0 0 120px",textAlign:"right"}}>
              {bearbeite && bearbeite.id===i.id
                ? <span>
                    <input autoFocus defaultValue={i.preis==null?"":i.preis}
                      onBlur={e=>preisUebernehmen(i.id, e.target.value)}
                      onKeyDown={e=>{ if(e.key==="Enter") e.target.blur(); if(e.key==="Escape") setBearbeite(null); }}
                      style={{width:92,padding:"4px 6px",fontSize:12,textAlign:"right",border:"1px solid "+P,borderRadius:6}}/>
                    <div style={{fontSize:10,color:AMBER,marginTop:3,textAlign:"right",lineHeight:1.4}}>
                      {i.verwendung.length
                        ? "wirkt sich auf "+i.verwendung.length+" Eingriff"+(i.verwendung.length>1?"e":"")+" aus: "
                          + i.verwendung.slice(0,3).map(function(v){return v.anzeige;}).join(", ")
                          + (i.verwendung.length>3 ? " …" : "")
                        : "wird derzeit in keinem Eingriff verwendet"}
                    </div>
                  </span>
                : <span data-tour="preis-inline" onClick={()=>setBearbeite({id:i.id})} title="Preis bearbeiten"
                    style={{fontSize:13,fontWeight:700,cursor:"pointer",
                            color: i.preis==null?AMBER:"#1D2421",borderBottom:"1px dotted "+LINIE}}>
                    {i.preis==null ? "kein Preis" : eurBetrag(i.preis)+" €"}</span>}
            </div>
            <div style={{flex:"0 0 130px",textAlign:"right"}}>
              {i.verwendung.length
                ? <span data-tour="preis-verwendung" onClick={()=>setOffen(Object.assign({},offen,{[i.id]:!auf}))}
                    style={{fontSize:11,color:P,cursor:"pointer",textDecoration:"underline"}}>
                    in {i.verwendung.length} Eingriff{i.verwendung.length>1?"en":""} {auf?"▴":"▾"}</span>
                : <span style={{fontSize:10,color:"#5C6660",fontStyle:"italic"}}>nicht verwendet</span>}
            </div>
            <div style={{flex:"0 0 74px",textAlign:"right"}}>
              <span onClick={()=>ersetzenStarten(i.id)} role="button"
                title="Dieses Implantat in allen Materialsätzen austauschen"
                style={{fontSize:10,color:"#5C6660",cursor:"pointer",textDecoration:"underline"}}>Ersetzen</span>
            </div>
            <div style={{flex:"0 0 18px",textAlign:"right"}}>
              {i.eigene && <span onClick={()=>positionLoeschen(i)} role="button" title="Eigene Position löschen"
                style={{cursor:"pointer",fontSize:15,lineHeight:1,color:"#9AA5A0",padding:"0 2px"}}>×</span>}
            </div>
          </div>
          <div style={{marginTop:6,height:4,background:"#F1F4F3",borderRadius:3,overflow:"hidden"}}>
            <div style={{width:anteil+"%",height:"100%",background:i.preis?P:"transparent",borderRadius:3}}></div>
          </div>
          {ersetzen && ersetzen.vonId===i.id && (function(){
            const betroffen = ersetzenBetroffen(i.id, ersetzen.zielId);
            const drin = [i.id];
            const treffer = bestandSuchen(ersetzen.suche, drin);
            return <div style={{marginTop:8,padding:"12px 14px",border:"1px solid "+P,borderRadius:10,background:"#FAFCFC"}}>
              {/* Schritt 1: Ziel waehlen */}
              {ersetzen.schritt==="waehlen" && <div>
                <div style={{fontSize:12,fontWeight:700,color:P,marginBottom:2}}>
                  „{i.bezeichnung}“ ersetzen durch …</div>
                <div style={{fontSize:11,color:"#5C6660",marginBottom:9,lineHeight:1.55}}>
                  {betroffen.length
                    ? "Der Austausch betrifft "+betroffen.length+" Eingriff"+(betroffen.length>1?"e":"")+". Die Mengen bleiben unverändert."
                    : "Dieses Implantat wird derzeit in keinem Eingriff verwendet."}
                </div>
                <input autoFocus value={ersetzen.suche} placeholder="Ersatz suchen oder neuen Namen eingeben…"
                  onChange={ev=>setErsetzen(Object.assign({},ersetzen,{suche:ev.target.value}))}
                  style={{width:"100%",boxSizing:"border-box",padding:"6px 8px",fontSize:11,
                          border:"1px solid "+LINIE,borderRadius:6}}/>
                {ersetzen.suche.trim() && <div style={{marginTop:4,border:"1px solid "+LINIE,borderRadius:6,
                    background:"#fff",overflow:"hidden"}}>
                  {treffer.map(function(z){
                    return <div key={z.id} onClick={()=>ersetzenZielWaehlen(z.id, z.bezeichnung)}
                      style={{padding:"6px 8px",fontSize:11,cursor:"pointer",borderBottom:"1px solid rgba(0,0,0,.04)"}}>
                      {z.bezeichnung}<span style={{color:"#5C6660",marginLeft:6}}>
                        {z.preis==null?"· kein Preis hinterlegt":"· "+eurBetrag(z.preis)+" €"}</span>
                    </div>;
                  })}
                  <div style={{padding:"7px 8px",display:"flex",gap:7,alignItems:"center",flexWrap:"wrap",
                      background: treffer.length?"#FAFCFC":"#fff"}}>
                    <span style={{fontSize:11,color:P,fontWeight:600,flex:"1 1 150px"}}>
                      + „{ersetzen.suche.trim()}“ neu anlegen
                      {treffer.length===0 && <span style={{fontWeight:400,color:"#5C6660"}}> — nichts im Bestand gefunden</span>}</span>
                    <input value={ersetzen.neuPreis} inputMode="decimal" placeholder="Einzelpreis (€)"
                      onChange={ev=>setErsetzen(Object.assign({},ersetzen,{neuPreis:ev.target.value}))}
                      onKeyDown={ev=>{ if(ev.key==="Enter") ersetzenZielNeu(); }}
                      style={{flex:"0 0 104px",padding:"4px 6px",fontSize:11,textAlign:"right",
                              border:"1px solid "+LINIE,borderRadius:6}}/>
                    <span onClick={ersetzenZielNeu}
                      style={{fontSize:11,padding:"4px 10px",borderRadius:6,cursor:"pointer",
                              border:"1px solid "+P,background:"#fff",color:P,fontWeight:600}}>Anlegen</span>
                  </div>
                </div>}
                <div style={{marginTop:9}}>
                  <span onClick={()=>setErsetzen(null)}
                    style={{fontSize:11,color:"#5C6660",cursor:"pointer"}}>Abbrechen</span>
                </div>
              </div>}

              {/* Schritt 2: Vorschau und Bestaetigung */}
              {ersetzen.schritt==="bestaetigen" && <div>
                <div style={{fontSize:12,fontWeight:700,color:P,marginBottom:6}}>
                  „{i.bezeichnung}“ → „{implantatBezeichnung(ersetzen.zielId)}“</div>
                {betroffen.length===0
                  ? <div style={{fontSize:11,color:"#5C6660",marginBottom:9}}>
                      Kein Eingriff verwendet dieses Implantat — es gibt nichts zu ersetzen.</div>
                  : <div style={{marginBottom:9}}>
                      <div style={{fontSize:11,color:"#5C6660",marginBottom:5}}>
                        Betroffen sind {betroffen.length} Eingriff{betroffen.length>1?"e":""}:</div>
                      <div style={{maxHeight:150,overflowY:"auto",border:"1px solid "+LINIE,borderRadius:6,background:"#fff"}}>
                        {betroffen.map(function(b,k){
                          return <div key={k} style={{padding:"4px 8px",fontSize:11,
                              borderBottom: k<betroffen.length-1?"1px solid rgba(0,0,0,.04)":"none"}}>
                            <span style={{fontWeight:600}}>{b.anzahl}×</span> {b.anzeige}
                            {b.kollision && <span style={{color:AMBER}}> · enthält beide — Mengen werden addiert</span>}
                          </div>;
                        })}
                      </div>
                    </div>}
                <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                  {betroffen.length>0 && <span onClick={ersetzenBestaetigen} style={btn(true)}>
                    In {betroffen.length} Eingriff{betroffen.length>1?"en":""} ersetzen</span>}
                  <span onClick={()=>setErsetzen(Object.assign({},ersetzen,{schritt:"waehlen",zielId:""}))}
                    style={btn(false)}>Zurück</span>
                  <span onClick={()=>setErsetzen(null)}
                    style={{fontSize:11,color:"#5C6660",cursor:"pointer"}}>Abbrechen</span>
                </div>
              </div>}

              {/* Schritt 3: separate Frage nach dem alten Implantat */}
              {ersetzen.schritt==="loeschfrage" && <div>
                <div style={{fontSize:12,fontWeight:700,color:"#2E7D32",marginBottom:4}}>
                  Ersetzt in {ersetzen.ersetzteAnzahl} Eingriff{ersetzen.ersetzteAnzahl>1?"en":""}.</div>
                <div style={{fontSize:11,color:"#5C6660",marginBottom:9,lineHeight:1.55}}>
                  „{i.bezeichnung}“ wird jetzt in keinem Materialsatz mehr verwendet.
                  Soll die Position auch aus dem Bestand gelöscht werden? Sie können sie
                  ebenso gut behalten, falls Sie sie später wieder brauchen.
                </div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  <span onClick={()=>ersetzenAltLoeschen(true)} style={btn(false)}>Aus dem Bestand löschen</span>
                  <span onClick={()=>ersetzenAltLoeschen(false)} style={btn(true)}>Im Bestand behalten</span>
                </div>
              </div>}
            </div>;
          })()}
          {auf && <div style={{marginTop:8,paddingLeft:10,borderLeft:"2px solid "+TINT}}>
            {i.verwendung.map(function(v,k){
              return <div key={k} style={{fontSize:11,color:"#5C6660",padding:"2px 0"}}>
                {v.anzahl}× in <strong style={{color:"#1D2421"}}>{v.anzeige}</strong>
                <span style={{color:"#9AA5A0"}}> · {v.sektion}</span>
              </div>;
            })}
          </div>}
        </div>;
      })}
    </div>}

    {/* ---------------- Ansicht: Eingriffe ---------------- */}
    {ansicht==="eingriffe" && <div>
      {eingriffeGefiltert.length===0 && <div style={{padding:20,fontSize:12,color:"#5C6660",textAlign:"center",
        background:"#fff",border:"1px solid "+LINIE,borderRadius:12}}>Kein Eingriff gefunden.</div>}
      {eingriffeGefiltert.map(function(e){
        // Der Balken zeigt den Anteil der Zeile an der Paketsumme — nicht mehr
        // ihr Verhältnis zur teuersten Einzelposition.
        const paketSumme = e.positionen.reduce(function(sa,x){ return sa + (x.preis||0); }, 0) || 1;
        return <div key={e.eingriffId+e.variante} style={{background:"#fff",border:"1px solid "+LINIE,
            borderRadius:12,marginBottom:10,overflow:"hidden"}}>
          <div style={{background:TINT,padding:"8px 14px",display:"flex",justifyContent:"space-between",
              alignItems:"center",gap:8,flexWrap:"wrap"}}>
            <span style={{fontSize:13,fontWeight:700,color:P}}>{e.name}
              {e.variante!=="Standard" && <span style={{fontWeight:400,fontStyle:"italic",color:"#5C6660"}}> · {e.variante}</span>}
              <span style={{fontSize:10,color:"#5C6660",fontWeight:400}}> · {e.sektion}</span></span>
            <span style={{fontSize:13,fontWeight:700,color: e.fehlend?AMBER:P}}>
              {e.fehlend ? "unvollständig — "+e.fehlend+" ohne Preis" : eurBetrag(e.summe)+" €"}</span>
          </div>
          <div style={{padding:"6px 14px 10px"}}>
            {e.positionen.map(function(pos,idx){
              const anteil = pos.preis ? Math.max(2, Math.round(pos.preis / paketSumme * 100)) : 0;
              return <div key={idx} style={{padding:"5px 0",borderBottom: idx<e.positionen.length-1?"1px solid #F1F4F3":"none"}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{flex:"1 1 auto",fontSize:12}}>{implantatBezeichnung(pos.implantat_id)}</span>
                  <input type="number" min="0" defaultValue={pos.anzahl}
                    onBlur={ev=>{ var n=parseInt(ev.target.value||"0",10); if(n!==pos.anzahl) mengeUebernehmen(e.eingriffId,e.variante,idx,n); }}
                    style={{flex:"0 0 46px",width:46,padding:"2px 4px",fontSize:11,textAlign:"center",
                            border:"1px solid "+LINIE,borderRadius:4}}/>
                  <span style={{flex:"0 0 78px",textAlign:"right",fontSize:11,color: pos.stueckpreis==null?AMBER:"#5C6660"}}>
                    {pos.stueckpreis==null?"—":eurBetrag(pos.stueckpreis)+" €"}</span>
                  <span style={{flex:"0 0 82px",textAlign:"right",fontSize:12,fontWeight:600,
                                color: pos.preis==null?AMBER:"#1D2421"}}>
                    {pos.preis==null?"kein Preis":eurBetrag(pos.preis)+" €"}</span>
                  {/* Bis hierher liess sich eine Zeile nur durch Eintragen der
                      Menge 0 entfernen — das findet niemand. Jetzt ausdrücklich. */}
                  <span onClick={()=>positionEntfernen(e, idx, pos)} role="button"
                    title={"„"+implantatBezeichnung(pos.implantat_id)+"“ aus diesem Eingriff entfernen"}
                    aria-label={"Position „"+implantatBezeichnung(pos.implantat_id)+"“ entfernen"}
                    style={{flex:"0 0 20px",textAlign:"right",cursor:"pointer",fontSize:15,
                            lineHeight:1,color:"#9AA5A0",userSelect:"none"}}>×</span>
                </div>
                <div style={{marginTop:4,display:"flex",alignItems:"center",gap:6}}>
                  <div style={{flex:1,height:3,background:"#F1F4F3",borderRadius:2,overflow:"hidden"}}>
                    <div style={{width:anteil+"%",height:"100%",background:pos.preis?P:"transparent"}}></div>
                  </div>
                  {pos.preis!=null && <span style={{flex:"0 0 34px",textAlign:"right",fontSize:9,
                    color:"#9AA5A0"}}>{anteil}%</span>}
                </div>
              </div>;
            })}
            {(function(){
              const key = e.eingriffId+"|"+e.variante;
              const txt = posSuche[key] || "";
              const drin = e.positionen.map(function(x){ return x.implantat_id; });
              const treffer = bestandSuchen(txt, drin);
              const neuForm = posNeu[key];
              return <div style={{marginTop:8,position:"relative"}}>
                <input value={txt} placeholder="Position hinzufügen — Bezeichnung eingeben…"
                  onChange={ev=>{ setPosSuche(Object.assign({},posSuche,{[key]:ev.target.value}));
                                  setPosNeu(Object.assign({},posNeu,{[key]:null})); }}
                  style={{width:"100%",boxSizing:"border-box",padding:"6px 8px",fontSize:11,
                          border:"1px solid "+LINIE,borderRadius:6}}/>
                {txt.trim() && !neuForm && <div style={{position:"absolute",zIndex:20,left:0,right:0,background:"#fff",
                    border:"1px solid "+LINIE,borderRadius:6,boxShadow:"0 4px 12px rgba(0,0,0,.08)",marginTop:2}}>
                  {treffer.map(function(i){
                    return <div key={i.id} onClick={()=>positionHinzufuegen(e, i.id)}
                      style={{padding:"6px 8px",fontSize:11,cursor:"pointer",borderBottom:"1px solid rgba(0,0,0,.04)"}}>
                      {i.bezeichnung}
                      <span style={{color:"#5C6660",marginLeft:6}}>
                        {i.preis==null ? "· kein Preis hinterlegt" : "· "+eurBetrag(i.preis)+" €"}</span>
                    </div>;
                  })}
                  {/* Findet die Suche nichts, laesst sich die Position hier direkt anlegen */}
                  <div onClick={()=>setPosNeu(Object.assign({},posNeu,{[key]:{bezeichnung:txt.trim(),preis:""}}))}
                    style={{padding:"6px 8px",fontSize:11,cursor:"pointer",color:P,fontWeight:600,
                            background: treffer.length?"#FAFCFC":"#fff"}}>
                    + „{txt.trim()}“ als neues Implantat anlegen
                    {treffer.length===0 && <span style={{fontWeight:400,color:"#5C6660"}}> — nichts im Bestand gefunden</span>}
                  </div>
                </div>}
                {neuForm && <div style={{marginTop:6,padding:"8px 10px",border:"1px solid "+P,borderRadius:8,
                    background:"#FAFCFC",display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                  <span style={{fontSize:11,flex:"1 1 160px"}}>Neu: <strong>{neuForm.bezeichnung}</strong>
                    <span style={{color:"#5C6660"}}> · {e.sektion}</span></span>
                  <input autoFocus value={neuForm.preis} inputMode="decimal" placeholder="Einzelpreis (€)"
                    onChange={ev=>setPosNeu(Object.assign({},posNeu,{[key]:Object.assign({},neuForm,{preis:ev.target.value})}))}
                    onKeyDown={ev=>{ if(ev.key==="Enter") posNeuAnlegen(e); if(ev.key==="Escape") setPosNeu(Object.assign({},posNeu,{[key]:null})); }}
                    style={{flex:"0 0 110px",padding:"5px 7px",fontSize:11,textAlign:"right",
                            border:"1px solid "+LINIE,borderRadius:6}}/>
                  <span onClick={()=>posNeuAnlegen(e)}
                    style={{fontSize:11,padding:"5px 12px",borderRadius:6,cursor:"pointer",
                            border:"1px solid "+P,background:P,color:"#fff",fontWeight:600}}>Anlegen &amp; hinzufügen</span>
                  <span onClick={()=>setPosNeu(Object.assign({},posNeu,{[key]:null}))}
                    style={{fontSize:11,color:"#5C6660",cursor:"pointer"}}>Abbrechen</span>
                </div>}
                {/* Nichts wird automatisch geloescht — der Nutzer entscheidet ueber die alte Zeile */}
                {e.positionen.length>0 && <div style={{marginTop:5,fontSize:10,color:"#9AA5A0",lineHeight:1.5}}>
                  Falls die neue Position eine vorhandene ersetzt, entfernen Sie die alte Zeile selbst —
                  automatisch wird nichts gelöscht.
                </div>}
              </div>;
            })()}
            <div style={{display:"flex",justifyContent:"space-between",paddingTop:8,marginTop:4,
                borderTop:"2px solid "+TINT,fontSize:12,fontWeight:700,color:P}}>
              <span>Paketsumme</span>
              <span>{e.fehlend ? "—" : eurBetrag(e.summe)+" €"}</span>
            </div>
          </div>
        </div>;
      })}
    </div>}
  </div>;
}

// HOMESCREEN-ANLEITUNG — erklärt, wie die App auf den Startbildschirm kommt.
// Erscheint einmalig nach dem Login, nur im Browser (nicht bei bereits vom
// Startbildschirm gestarteter App), und ist danach über das Symbol in der
// Kopfzeile jederzeit wieder aufrufbar.
// ============================================================================
const HOMESCREEN_MERKER = "ft-homescreen-gesehen";

// Läuft die App bereits vom Startbildschirm?
function alsAppGestartet(){
  try{
    return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)
        || window.navigator.standalone === true;
  }catch(e){ return false; }
}
// Welche Anleitung passt zum Gerät?
function geraeteArt(){
  var ua = navigator.userAgent || "";
  var iOS = /iPad|iPhone|iPod/.test(ua)
         || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);   // iPad ab iPadOS 13
  if (iOS) {
    // Auf iOS kann nur Safari zum Startbildschirm hinzufügen
    var safari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|Chrome/.test(ua);
    return safari ? "ios_safari" : "ios_anderer";
  }
  if (/Android/.test(ua)) return "android";
  return "desktop";
}

// Kleine Symbolgrafiken, damit man sie auf dem eigenen Gerät wiedererkennt
function SymbolTeilen(){   // iOS: Quadrat mit Pfeil nach oben
  return <svg width="17" height="21" viewBox="0 0 17 21" fill="none" aria-hidden="true"
    style={{verticalAlign:"-5px",margin:"0 3px"}}>
    <path d="M8.5 1.5v11" stroke="#10535B" strokeWidth="1.6" strokeLinecap="round"/>
    <path d="M5 5l3.5-3.5L12 5" stroke="#10535B" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
    <path d="M3.5 8.5h-2v11h14v-11h-2" stroke="#10535B" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
  </svg>;
}
function SymbolMenue(){    // Android: drei Punkte übereinander
  return <svg width="6" height="20" viewBox="0 0 6 20" aria-hidden="true"
    style={{verticalAlign:"-4px",margin:"0 5px"}}>
    <circle cx="3" cy="4" r="1.7" fill="#10535B"/>
    <circle cx="3" cy="10" r="1.7" fill="#10535B"/>
    <circle cx="3" cy="16" r="1.7" fill="#10535B"/>
  </svg>;
}

function HomescreenKarte({onClose, alsSchritt}){
  const art = geraeteArt();
  const P="#10535B", TINT="#E6F0F1", LINIE="#D6E2E3", GRAU="#5C6660";
  const istMac = /Mac/.test(navigator.platform||"");

  var schritte;
  if (art === "ios_safari") {
    schritte = <p style={{margin:0}}>
      Tippen Sie unten in der Leiste auf das Teilen-Symbol<SymbolTeilen/>

    schritte = <p style={{margin:0}}>
      Auf dem iPhone und iPad klappt das nur über <strong>Safari</strong>. Öffnen Sie diese Seite
      einmal dort, tippen Sie unten auf das Teilen-Symbol<SymbolTeilen/>

  } else if (art === "android") {
    schritte = <p style={{margin:0}}>
      Tippen Sie oben rechts auf die drei Punkte<SymbolMenue/>
      und wählen Sie <strong>„App installieren"</strong> beziehungsweise
      <strong> „Zum Startbildschirm hinzufügen"</strong>.
    </p>;
  } else {
    schritte = <p style={{margin:0}}>
      Speichern Sie sich diese Seite als Lesezeichen
      (<strong>{istMac ? "Cmd + D" : "Strg + D"}</strong>) — Sie bleiben angemeldet
      und sind mit einem Klick wieder hier.
    </p>;
  }

  return <div style={{width:"100%",maxWidth:640,margin:"0 auto 18px",background:"#fff",
      border:"1px solid "+LINIE,borderRadius:12,boxShadow:"0 2px 10px rgba(16,83,91,.07)",overflow:"hidden"}}>
    <div style={{background:TINT,padding:"9px 14px",display:"flex",alignItems:"center",
        justifyContent:"space-between",gap:10}}>
      <span style={{fontFamily:"'Source Serif 4',Georgia,serif",fontSize:14,fontWeight:700,color:P}}>
        Immer griffbereit</span>
      {!alsSchritt && <span onClick={onClose} title="Nicht mehr anzeigen" role="button"
        style={{cursor:"pointer",fontSize:17,lineHeight:1,color:GRAU,padding:"0 2px"}}>×</span>}
    </div>
    <div style={{padding:"12px 16px 14px",fontSize:13,lineHeight:1.65,color:"#1D2421"}}>
      <p style={{margin:"0 0 8px",color:GRAU}}>
        So öffnen Sie Fuss-Track Clinic künftig mit einem Tipp — wie eine App, ohne App-Store.
      </p>
      {schritte}
      {!alsSchritt && <div style={{marginTop:12,textAlign:"right"}}>
        <span onClick={onClose} style={{fontSize:12,color:P,textDecoration:"underline",cursor:"pointer"}}>
          Verstanden, nicht mehr anzeigen</span>

  </div>;
}

function Rundgang({onFertig, schritte: eigeneSchritte, merker}){
  const P="#10535B", TINT="#E6F0F1", LINIE="#D6E2E3", GRAU="#5C6660", TINTE="#1D2421";
  // Der Homescreen-Schritt entfällt, wenn die App bereits vom Startbildschirm läuft
  const istMenueRundgang = !eigeneSchritte;
  const schritte = React.useMemo(function(){
    return (eigeneSchritte || RUNDGANG_SCHRITTE)
      .filter(function(s){ return !(s.homescreen && alsAppGestartet()); });
  }, [eigeneSchritte]);
  const [i, setI] = useState(0);
  const [rect, setRect] = useState(null);
  const [blaseHoehe, setBlaseHoehe] = useState(240);
  const [zielFehlt, setZielFehlt] = useState(false);
  const blaseRef = React.useRef(null);
  const s = schritte[i];

  // Position der erklärten Region aus den echten Elementen berechnen
  React.useEffect(function(){
    function messen(){
      if (!s.ziele) { setRect(null); return; }
      var kasten = null;
      s.ziele.forEach(function(sel){
        var el = document.querySelector(sel);
        if (!el) return;
        var r = el.getBoundingClientRect();
        if (!r.width && !r.height) return;
        kasten = kasten
          ? {top:Math.min(kasten.top,r.top), left:Math.min(kasten.left,r.left),
             bottom:Math.max(kasten.bottom,r.bottom), right:Math.max(kasten.right,r.right)}
          : {top:r.top, left:r.left, bottom:r.bottom, right:r.right};
      });
      setRect(kasten);
      setZielFehlt(!!(s.ziele && s.ziele.length && !kasten));
    }
    // Erst die gesamte Region in den sichtbaren Bereich holen, dann vermessen.
    // Bewusst ohne weiches Rollen: sonst misst man mitten in der Bewegung und
    // die Hervorhebung sitzt auf halbem Weg fest.
    if (s.ziele && s.ziele.length) {
      var el0 = document.querySelector(s.ziele[0]);
      var elN = document.querySelector(s.ziele[s.ziele.length-1]) || el0;
      if (el0) {
        var o = el0.getBoundingClientRect(), u = elN.getBoundingClientRect();
        var mitteRegion = (Math.min(o.top,u.top) + Math.max(o.bottom,u.bottom)) / 2;
        var versatz = mitteRegion - (window.innerHeight||640)/2;
        // Nur rollen, wenn die Region nicht ohnehin gut sichtbar ist
        if (Math.abs(versatz) > 40) window.scrollBy({top:versatz, behavior:"auto"});
      }
    }
    var t1 = setTimeout(messen, 0), t2 = setTimeout(messen, 120);
    window.addEventListener("resize", messen);
    window.addEventListener("orientationchange", messen);
    window.addEventListener("scroll", messen, true);
    return function(){
      clearTimeout(t1); clearTimeout(t2);
      window.removeEventListener("resize", messen);
      window.removeEventListener("orientationchange", messen);
      window.removeEventListener("scroll", messen, true);
    };
  }, [i]);

  React.useLayoutEffect(function(){
    if (blaseRef.current) {
      var h = blaseRef.current.offsetHeight;
      if (h && Math.abs(h - blaseHoehe) > 2) setBlaseHoehe(h);
    }
  });

  // Der Rundgang gilt als gesehen, sobald er einmal auf dem Schirm war — auch
  // wenn er nicht ueber "Fertig" oder "Ueberspringen" verlassen wurde.
  // Grund: bei hervorgehobenen Schritten liegt ueber der Seite nur ein Element
  // mit pointerEvents:"none" (die Abdunklung ist dessen Schlagschatten), also
  // sind alle Kacheln weiter anklickbar. Wer waehrend des Rundgangs eine
  // Funktion oeffnet, haengt diese Komponente aus, ohne dass beenden() laeuft —
  // der Merker fehlte, und im Menue startete der Rundgang wieder von vorn.
  React.useEffect(function(){
    return function(){
      try{ localStorage.setItem(merker || RUNDGANG_MERKER, "1"); }catch(e){}
    };
  }, [merker]);

  const letzter = i === schritte.length - 1;
  function weiter(){ if (letzter) beenden(); else setI(i+1); }
  function zurueck(){ if (i>0) setI(i-1); }
  function beenden(){
    try{
      localStorage.setItem(merker || RUNDGANG_MERKER, "1");
      // Nur im Menü-Rundgang war die Homescreen-Karte ein Schritt
      if (istMenueRundgang) localStorage.setItem(HOMESCREEN_MERKER, "1");
    }catch(e){}
    onFertig();
  }

  // Pfeiltasten am Rechner
  React.useEffect(function(){
    function taste(ev){
      if (ev.key === "ArrowRight" || ev.key === "Enter") { ev.preventDefault(); weiter(); }
      else if (ev.key === "ArrowLeft") { ev.preventDefault(); zurueck(); }
      else if (ev.key === "Escape") { ev.preventDefault(); beenden(); }
    }
    window.addEventListener("keydown", taste);
    return function(){ window.removeEventListener("keydown", taste); };
  }, [i, letzter]);

  // ---- Sprechblase platzieren: unter der Region, sonst darüber, sonst mittig
  const rand = 12;
  const breite = Math.min(340, (window.innerWidth || 360) - 2*rand);
  // Die Blase wird immer mit einem numerischen top platziert und anschliessend
  // in den Bildschirm geklemmt. Ihre echte Hoehe kennen wir aus der Messung —
  // sonst rutscht sie bei tief liegenden Regionen nach oben aus dem Bild.
  const vh = window.innerHeight || 640, vw = window.innerWidth || 360;
  var oben;
  if (rect) {
    const platzUnten = vh - rect.bottom, platzOben = rect.top;
    if (platzUnten >= blaseHoehe + 20)     oben = rect.bottom + 14;
    else if (platzOben >= blaseHoehe + 20) oben = rect.top - blaseHoehe - 14;
    else                                    oben = vh - blaseHoehe - rand;   // Region zu gross
  } else {
    oben = (vh - blaseHoehe) / 2;
  }
  oben = Math.max(rand, Math.min(oben, vh - blaseHoehe - rand));
  var links = rect ? ((rect.left + rect.right)/2 - breite/2) : (vw - breite)/2;
  links = Math.max(rand, Math.min(links, vw - breite - rand));
  const blase = {top: Math.round(oben), left: Math.round(links)};

  const knopf = (haupt) => ({padding:"8px 16px",borderRadius:8,fontSize:13,fontWeight:600,cursor:"pointer",
    border:"1px solid "+(haupt?P:LINIE), background: haupt?P:"#fff", color: haupt?"#fff":GRAU,
    userSelect:"none", whiteSpace:"nowrap"});

  // Der Rundgang wird bewusst NEBEN die App gehängt: die Schriftgrößen-Einstellung
  // skaliert den App-Baum, und in einem skalierten Baum verrutschen fest
  // positionierte Elemente gegenüber den gemessenen Positionen.
  return ReactDOM.createPortal(
    <div style={{position:"fixed",inset:0,zIndex:100000}} role="dialog" aria-label="Einführungs-Rundgang">
    {/* Abdunklung: bei hervorgehobener Region als Ring um das Loch, sonst flächig */}
    {/* Der Ausschnitt springt bewusst ohne Übergang an seine neue Stelle. Eine
        Animation der Geometrie sieht bei jedem Schrittwechsel und nach jedem
        Drehen des Geräts so aus, als flöge der Rahmen über die Seite. */}
    {rect
      ? <div key="ausschnitt" style={{position:"fixed", top:rect.top-6, left:rect.left-6,
          width:(rect.right-rect.left)+12, height:(rect.bottom-rect.top)+12,
          borderRadius:14, pointerEvents:"none", border:"2px solid "+P,
          boxShadow:"0 0 0 9999px rgba(11,62,69,.72)"}}/>
      : <div key="vollflaeche" style={{position:"fixed",inset:0,background:"rgba(11,62,69,.72)"}}/>}

    {/* Überspringen */}
    {!letzter && <div onClick={beenden} role="button"
      style={{position:"fixed",top:12,right:12,zIndex:2,padding:"6px 12px",borderRadius:8,
              background:"rgba(255,255,255,.92)",border:"1px solid "+LINIE,color:GRAU,
              fontSize:12,cursor:"pointer",userSelect:"none"}}>Überspringen</div>}

    {/* Sprechblase */}
    <div ref={blaseRef} style={Object.assign({position:"fixed", width:breite, zIndex:2, background:"#fff",
        border:"1px solid "+LINIE, borderRadius:12, boxShadow:"0 6px 24px rgba(16,83,91,.22)",
        maxHeight:"84vh", overflowY:"auto"}, blase)}>

      {s.homescreen
        ? <div style={{padding:"4px 4px 0"}}><HomescreenKarte alsSchritt={true} onClose={function(){}}/></div>
        : <div style={{padding:"16px 18px 4px"}}>
            <div style={{fontFamily:"'Source Serif 4',Georgia,serif",fontSize:16,fontWeight:700,
                color:P, marginBottom:6}}>{s.titel}</div>
            <div style={{fontSize:13,lineHeight:1.65,color:TINTE}}>{s.text}</div>
            {s.hinweis && <div style={{marginTop:8,padding:"7px 10px",background:TINT,borderRadius:8,
                fontSize:12,color:P,lineHeight:1.55}}>{s.hinweis}</div>}
            {zielFehlt && <div style={{marginTop:8,padding:"7px 10px",background:"#FBF3DF",
                borderRadius:8,fontSize:12,color:"#8A5A00",lineHeight:1.55}}>
              {s.wennFehlt || "Dieser Bereich erscheint erst, sobald Sie oben eine Auswahl getroffen haben."}
            </div>}
            {s.navBeispiel && <div style={{marginTop:10,display:"flex",gap:8,alignItems:"center"}}>
              <span style={{padding:"5px 10px",borderRadius:6,border:"1px solid "+LINIE,
                background:"#fff",color:P,fontSize:11,fontWeight:600}}>← Menü</span>
              <span style={{padding:"5px 10px",borderRadius:6,border:"1px solid "+LINIE,
                background:"#fff",color:P,fontSize:12,fontWeight:600}}>⌂</span>
              <span style={{padding:"5px 10px",borderRadius:6,border:"1px solid "+LINIE,
                background:"#fff",color:P,fontSize:12,fontWeight:600}}>?</span>
            </div>}
          </div>}

      {/* Fortschritt und Steuerung */}
      <div style={{display:"flex",alignItems:"center",gap:10,padding:"12px 18px 14px",flexWrap:"wrap"}}>
        <div style={{display:"flex",gap:5,flex:"1 1 auto"}}>
          {schritte.map(function(_,k){
            return <span key={k} onClick={()=>setI(k)} title={"Schritt "+(k+1)}
              style={{width:k===i?18:7,height:7,borderRadius:4,cursor:"pointer",
                      background:k===i?P:(k<i?"#9DBFC2":LINIE),transition:"all .2s"}}/>;
          })}
        </div>
        {i>0 && <span onClick={zurueck} style={knopf(false)}>Zurück</span>}
        <span onClick={weiter} style={knopf(true)}>{letzter ? "Fertig" : "Weiter"}</span>
      </div>
    </div>
  </div>, document.body);
}

// EINSTELLUNGEN — Hilfe, Konto, eigene Daten, Darstellung, Über.
// Bewusst nur Abschnitte, hinter denen auch etwas steht.
// ============================================================================
// Einzige Quelle der Versionsangabe. Der Sprechstundenbrief-Kopf hatte lange
// eine eigene, fest eingetippte Zeile und lief dadurch auf eine abweichende
// Zaehlung ("v4"/"v5") — beide Stellen lesen jetzt von hier.
const APP_VERSION = "v2.8";
const APP_STAND   = "August 2026";

// Hängt an eine Funktion ihren Rundgang. Er läuft beim ERSTEN Öffnen von selbst
// und danach nur noch, wenn er aus den Einstellungen angestoßen wird.
function MitRundgang({schritte, merker, anstoss, onVerbraucht, children}){
  // Zwei Auslöser: das erste Öffnen der Funktion (Merker noch nicht gesetzt)
  // und ein ausdrücklicher Anstoß aus den Einstellungen. Der Anstoß wirkt auch
  // beim Einhängen der Komponente — die Funktion wird ja gerade erst geöffnet.
  const [laeuft, setLaeuft] = useState(function(){
    if (anstoss) return true;
    try{ return localStorage.getItem(merker) !== "1"; }catch(e){ return false; }
  });
  const letzterAnstoss = React.useRef(anstoss);
  useEffect(function(){
    if (anstoss !== letzterAnstoss.current) {
      letzterAnstoss.current = anstoss;
      if (anstoss) setLaeuft(true);
    }
  }, [anstoss]);
  function fertig(){
    setLaeuft(false);
    // Wunsch zurücksetzen, sonst startet der Rundgang beim nächsten Öffnen erneut
    if (onVerbraucht) onVerbraucht();
  }
  return <React.Fragment>
    {children}
    {laeuft && <Rundgang schritte={schritte} merker={merker} onFertig={fertig}/>}
  </React.Fragment>;
}

function EinstellungenView({onSelect, onRundgang}){
  const P="#10535B", TINT="#E6F0F1", LINIE="#D6E2E3", GRAU="#5C6660", TINTE="#1D2421";
  const [email, setEmail] = useState("");
  const [gross, setGross] = useState(schriftGelesen());
  const [zeigeTipp, setZeigeTipp] = useState(false);
  const [pwOffen, setPwOffen] = useState(false);
  const [pw1, setPw1] = useState(""), [pw2, setPw2] = useState("");
  const [meldung, setMeldung] = useState("");

  useEffect(function(){
    if (!window._SB) { setEmail("lokaler Entwicklungszugang"); return; }
    window._SB.auth.getUser().then(function(r){
      var u = r && r.data && r.data.user;
      setEmail(u && u.email ? u.email : "unbekannt");
    }).catch(function(){ setEmail("unbekannt"); });
  }, []);

  function schriftUmschalten(neu){
    setGross(neu);
    try{ localStorage.setItem(SCHRIFT_MERKER, neu ? "gross" : "normal"); }catch(e){}
    schriftAnwenden(neu);
  }
  function passwortSpeichern(){
    if (pw1.length < 8) { setMeldung("Das Passwort braucht mindestens acht Zeichen."); return; }
    if (pw1 !== pw2)    { setMeldung("Die beiden Eingaben stimmen nicht überein."); return; }
    if (!window._SB)    { setMeldung("Ohne Anmeldung lässt sich kein Passwort ändern."); return; }
    setMeldung("Wird gespeichert …");
    window._SB.auth.updateUser({password: pw1}).then(function(r){
      if (r && r.error) { setMeldung("Fehlgeschlagen: " + r.error.message); return; }
      setPw1(""); setPw2(""); setPwOffen(false);
      setMeldung("Passwort geändert.");
      setTimeout(function(){ setMeldung(""); }, 4000);
    }).catch(function(e){ setMeldung("Fehlgeschlagen: " + (e && e.message ? e.message : e)); });
  }
  function abmelden(){
    if (!window.confirm("Von Fuss-Track Clinic abmelden?")) return;
    if (!window._SB) { setMeldung("Lokal ist keine Anmeldung aktiv."); return; }
    window._SB.auth.signOut().catch(function(){}).then(function(){

      borderRadius:8,fontSize:12,color:P}}>{meldung}</div>}

    {/* ---- Hilfe & Rundgänge ---- */}

    try{ return !alsAppGestartet() && localStorage.getItem(HOMESCREEN_MERKER) !== "1"; }
    catch(e){ return !alsAppGestartet(); }

    try{ localStorage.setItem(HOMESCREEN_MERKER, "1"); }catch(e){}

function App() {
  const [tool, setTool] = React.useState(null);
  // Ein Abonnent an der Wurzel: wechselt der Konto-Abruf seinen Zustand, rendert
  // der ganze Baum neu. Sonst haengen Werkzeuge, die schon montiert waren, auf
  // dem Ladezustand fest, obwohl die Preise laengst da sind.
  useKontoStatus();
  // Zähler statt Schalter: ein erneuter Aufruf desselben Rundgangs muss ihn
  // wieder anstoßen, auch wenn er vorher schon lief.
  // Verbrauchbares Signal. Ein Zaehler taugt hier nicht: LandingPage haengt
  // sich bei jeder Rueckkehr aus einem Werkzeug neu ein, und beim Einhaengen
  // laesst sich ein "neuer" Zaehlerstand nicht von einem alten unterscheiden —
  // der Rundgang startete dann bei jeder Rueckkehr erneut.
  const [menueRundgangWunsch, setMenueRundgangWunsch] = React.useState(false);
  // Welcher Funktions-Rundgang soll beim nächsten Öffnen laufen? null = keiner,
  // "auto" = nur beim ersten Mal, "erzwingen" = aus den Einstellungen heraus.
  const [tourWunsch, setTourWunsch] = React.useState({});

  function zurEinstellung(){ setTool("einstellungen"); }
  // Aus den Einstellungen heraus: Funktion öffnen und dort den Rundgang starten
  function rundgangStarten(welcher){
    if (welcher === "menue") { setTool(null); setMenueRundgangWunsch(true); return; }
    setTourWunsch(function(w){ var n=Object.assign({},w); n[welcher]=(n[welcher]||0)+1; return n; });
    setTool(welcher === "sb" ? "sb" : welcher === "ob" ? "ob" : "preise");
  }
  const kopf = function(titel){
    return {titel:titel, onHome:()=>setTool(null), onEinstellungen:zurEinstellung};
  };
  
  if (tool === "sb") return (
    <div>
      <ToolKopfleiste titel="Sprechstundenbrief" onHome={()=>setTool(null)} onEinstellungen={zurEinstellung}/>
      <MitRundgang schritte={RUNDGANG_SB} merker={RUNDGANG_SB_MERKER} anstoss={tourWunsch.sb} onVerbraucht={()=>setTourWunsch(function(w){ var n=Object.assign({},w); n.sb=0; return n; })}>
        <SprechstundenbriefApp />
      </MitRundgang>
    </div>
  );
  
  if (tool === "ob") return (
    <div>
      <ToolKopfleiste titel="OP-Bericht Generator" onHome={()=>setTool(null)} onEinstellungen={zurEinstellung}/>
      <MitRundgang schritte={RUNDGANG_OB} merker={RUNDGANG_OB_MERKER} anstoss={tourWunsch.ob} onVerbraucht={()=>setTourWunsch(function(w){ var n=Object.assign({},w); n.ob=0; return n; })}>
        <OPBerichtApp />
      </MitRundgang>
    </div>
  );
  
  
  if (tool === "aufklaerung") return (
    <div>
      <ToolKopfleiste titel="Aufklärungstexte" onHome={()=>setTool(null)} onEinstellungen={zurEinstellung}/>
      <AufklaerungstoolView />
    </div>
  );

  if (tool === "hdrg") return (
    <div>
      <ToolKopfleiste titel="OPS-Code Zuordnung 2026" onHome={()=>setTool(null)} onEinstellungen={zurEinstellung}/>

        <div style={{textAlign:"center",marginBottom:24}}>
          <div style={{fontFamily:"'Source Serif 4',Georgia,serif",fontSize:22,fontWeight:700,color:"#006B6F"}}>🔍 OPS-Code Zuordnung 2026</div>
        </div>
        <div style={{background:"#fff",border:"1px solid rgba(0,0,0,.08)",borderRadius:14,boxShadow:"0 1px 3px rgba(0,0,0,.06)"}}>
          <HDRGSearch/>
        </div>
      </div>
    </div>
  );


  if (tool === "manuale") return (
    <div>
      <ToolKopfleiste titel="OP-Manuale" onHome={()=>setTool(null)} onEinstellungen={zurEinstellung}/>
      <div style={{fontFamily:"system-ui,-apple-system,'Segoe UI',Roboto,sans-serif",maxWidth:700,margin:"0 auto",padding:"20px 16px 40px"}}>
        <div style={{textAlign:"center",marginBottom:24}}>

          <OPManuale/>
        </div>
      </div>
    </div>
  );

  if (tool === "klassifikationen") return (
    <div>

          <KlassifikationenView/>
        </div>
      </div>
    </div>
  );

  if (tool === "preise") return (
    <div>
      <ToolKopfleiste titel="Implantatpreise" onHome={()=>setTool(null)} onEinstellungen={zurEinstellung}/>

      <div style={{fontFamily:"system-ui,-apple-system,'Segoe UI',Roboto,sans-serif",maxWidth:1020,margin:"0 auto",padding:"16px 16px 40px"}}>

        </div>
        <ImplantatpreiseView/>
      </div>
      </MitRundgang>
    </div>
  );

  if (tool === "roentgen") return (
    <div>
      <ToolKopfleiste titel="Röntgen & Messmethoden" onHome={()=>setTool(null)} onEinstellungen={zurEinstellung}/>
      <div style={{fontFamily:"system-ui,-apple-system,'Segoe UI',Roboto,sans-serif",maxWidth:900,margin:"0 auto",padding:"20px 16px 40px"}}>
        <div style={{textAlign:"center",marginBottom:24}}>
          <div style={{fontFamily:"'Source Serif 4',Georgia,serif",fontSize:22,fontWeight:700,color:"#006B6F"}}>📐 Röntgenbilder mit Messmethoden</div>
        </div>
        <div style={{background:"#fff",border:"1px solid rgba(0,0,0,.08)",borderRadius:14,boxShadow:"0 1px 3px rgba(0,0,0,.06)"}}>
          <RoentgenView/>
        </div>
      </div>
    </div>
  );

  if (tool === "codes") return (
    <div>
      <ToolKopfleiste titel="Code-Übersicht" onHome={()=>setTool(null)} onEinstellungen={zurEinstellung}/>
      <div style={{fontFamily:"system-ui,-apple-system,'Segoe UI',Roboto,sans-serif",maxWidth:1100,margin:"0 auto",padding:"20px 16px 40px"}}>
        <div style={{textAlign:"center",marginBottom:24}}>
          <div style={{fontFamily:"'Source Serif 4',Georgia,serif",fontSize:22,fontWeight:700,color:"#006B6F",marginBottom:4}}>🧾 Code-Übersicht</div>
          <div style={{fontSize:11,color:"#718096"}}>Alle OPS-Codes im Tool · zentrale Bibliothek · Verwendung pro Eingriff</div>
        </div>
        <div style={{background:"#fff",border:"1px solid rgba(0,0,0,.08)",borderRadius:14,boxShadow:"0 1px 3px rgba(0,0,0,.06)"}}>
          <CodeUebersicht/>
        </div>
      </div>
    </div>
  );


    if (tool === "einstellungen") return (
      <div>
        <ToolKopfleiste titel="Einstellungen" onHome={()=>setTool(null)}/>
        <EinstellungenView onSelect={setTool} onRundgang={rundgangStarten}/>
      </div>
    );

    return <LandingPage onSelect={setTool} rundgangWunsch={menueRundgangWunsch}
             onWunschVerbraucht={()=>setMenueRundgangWunsch(false)} />;
}

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Zugang einrichten – Fuss-Track Clinic</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- Schriften lokal aus /fonts — keine externen Font-Server (DSGVO). -->
<style>
  @font-face{font-family:'Source Serif 4';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/source-serif-4-700.woff2') format('woff2')}
  @font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/ibm-plex-sans-400.woff2') format('woff2')}
  @font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/ibm-plex-sans-600.woff2') format('woff2')}
  :root{--op:#10535B;--op-dark:#0B3E45;--paper:#FAFAF7;--ink:#1D2421;--muted:#5C6660;--line:#D6E2E3;--amber:#8A5A00;--amber-bg:#FBF3DF;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.65;font-size:16.5px;}
  .wrap{max-width:520px;margin:0 auto;padding:56px 24px 64px;}
  h1{font-family:'Source Serif 4',Georgia,serif;color:var(--op);font-size:26px;line-height:1.2;margin-bottom:14px;}
  p{margin-bottom:12px;}
  a{color:var(--op);}
  .karte{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px 26px;box-shadow:0 18px 40px -28px rgba(16,83,91,.4);}
  .knopf{display:inline-block;width:100%;background:var(--op);color:#fff;border:1.5px solid var(--op);
         padding:.85em 1.4em;border-radius:8px;font-weight:600;font-size:1rem;font-family:inherit;
         cursor:pointer;text-align:center;transition:background .15s;}
  .knopf:hover{background:var(--op-dark)}
  .knopf:disabled{opacity:.6;cursor:default}
  input{width:100%;padding:10px 12px;margin-bottom:10px;border:1px solid #CBD5E0;border-radius:8px;
        font-size:15px;font-family:inherit;}
  .klein{font-size:13.5px;color:var(--muted);}
  .warn{background:var(--amber-bg);border:1px solid var(--amber);color:var(--amber);
        border-radius:8px;padding:14px 16px;font-size:14px;margin-bottom:16px;}
  .verborgen{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="karte">
    <h1>Zugang einrichten</h1>

    <!-- Ausgangszustand: NICHTS wird automatisch eingeloest. Der Knopf ist der
         entscheidende Punkt dieser Seite — siehe Kommentar im Skript unten. -->
    <div id="schritt-start">
      <p>Sie richten Ihren Zugang zu <strong>Fuss-Track Clinic</strong> ein.</p>
      <p class="klein">Der Link aus der E-Mail ist aus Sicherheitsgründen nur begrenzt gültig
         und lässt sich nur einmal verwenden. Bitte legen Sie jetzt Ihr Passwort fest.</p>
      <button id="knopf-start" class="knopf" type="button">Passwort festlegen</button>
    </div>

    <!-- Passwortformular, erscheint erst nach erfolgreicher Einloesung -->
    <div id="schritt-passwort" class="verborgen">
      <p>Bitte vergeben Sie ein Passwort für Ihr Konto.</p>
      <input id="pw1" type="password" placeholder="Neues Passwort (mindestens 8 Zeichen)" autocomplete="new-password">
      <input id="pw2" type="password" placeholder="Passwort wiederholen" autocomplete="new-password">
      <button id="knopf-speichern" class="knopf" type="button">Passwort speichern und anmelden</button>
    </div>

    <div id="meldung" class="verborgen"></div>
    <p id="fuss" class="klein verborgen" style="margin-top:18px">
      <a href="app.html">Zur Anmeldung</a>
    </p>
  </div>
</div>

<script>
(function(){
  var CFG = {
    url: "https://nfvrdhrxfgclczllzwzz.supabase.co",
    anonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5mdnJkaHJ4ZmdjbGN6bGx6d3p6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MzIzMDUsImV4cCI6MjEwMDQwODMwNX0.Ce8qDJiOalb4k8pwDzn4CmAXDv4j0nFg9lekWa59Lhg"
  };

  var q         = new URLSearchParams(location.search);
  var tokenHash = q.get("token_hash");
  var typ       = q.get("type") || "invite";      // invite | recovery | email

  var elStart  = document.getElementById("schritt-start");
  var elPw     = document.getElementById("schritt-passwort");
  var elMeldung= document.getElementById("meldung");
  var elFuss   = document.getElementById("fuss");
  var knopf    = document.getElementById("knopf-start");
  var speichern= document.getElementById("knopf-speichern");

  function zeige(el){ el.classList.remove("verborgen"); }
  function verbirg(el){ el.classList.add("verborgen"); }
  function melde(html, alsWarnung){
    elMeldung.innerHTML = html;
    elMeldung.className = alsWarnung ? "warn" : "klein";
    zeige(elMeldung); zeige(elFuss);
  }

  // ---------------------------------------------------------------------
  // WARUM DIESE SEITE ÜBERHAUPT EXISTIERT
  //
  // Frueher zeigte der Link in der E-Mail direkt auf Supabases
  // /auth/v1/verify. Dieser Aufruf loest den Token SERVERSEITIG ein, sobald
  // die Adresse geoeffnet wird — auch von einem Mail-Scanner. GMX ruft Links
  // in Nachrichten vorab auf; der Token war dann verbraucht, bevor die
  // Empfaengerin ihn benutzen konnte ("ungueltig oder abgelaufen").
  //
  // Hier passiert beim blossen Aufruf NICHTS. Der Token wird erst durch den
  // Klick auf den Knopf eingeloest (verifyOtp). Ein automatischer Abruf laedt
  // damit nur diese Seite und verbraucht nichts.
  //
  // Voraussetzung: die E-Mail-Vorlage muss auf diese Seite verweisen und
  // {{ .TokenHash }} mitgeben — siehe supabase/vorlagen/.
  // ---------------------------------------------------------------------

  if (!tokenHash) {
    verbirg(elStart);
    melde("Dieser Aufruf enthält keinen gültigen Zugangsschlüssel. "
        + "Bitte öffnen Sie den Link direkt aus der E-Mail.", true);
    return;
  }

  var client = null;
  function mitClient(weiter){
    if (client) { weiter(); return; }
    var s = document.createElement("script");
    s.src = "lib/supabase.js";
    s.onload = function(){
      client = window.supabase.createClient(CFG.url, CFG.anonKey);
      weiter();
    };
    s.onerror = function(){
      melde("Die Verbindung konnte nicht hergestellt werden. Bitte laden Sie die Seite neu.", true);
      knopf.disabled = false; knopf.textContent = "Passwort festlegen";
    };
    document.head.appendChild(s);
  }

  knopf.addEventListener("click", function(){
    knopf.disabled = true;
    knopf.textContent = "Einen Moment …";
    mitClient(function(){
      client.auth.verifyOtp({ token_hash: tokenHash, type: typ }).then(function(r){
        if (r.error) throw r.error;
        verbirg(elStart);
        zeige(elPw);
        document.getElementById("pw1").focus();
      }).catch(function(){
        verbirg(elStart);
        // Der haeufigste Grund ist NICHT Nutzerverschulden — das sagt die
        // Meldung ausdruecklich, sonst sucht die Person den Fehler bei sich.
        melde("<strong>Dieser Link ist nicht mehr gültig.</strong><br><br>"
            + "Das kann zwei Gründe haben: Der Link ist abgelaufen — oder er wurde bereits "
            + "verwendet. Manche E-Mail-Anbieter öffnen Links automatisch zur Sicherheitsprüfung; "
            + "dann kann ein Link verbraucht sein, obwohl Sie ihn selbst noch nicht benutzt haben. "
            + "Das ist kein Fehler Ihrerseits.<br><br>"
            + "Fordern Sie bitte über <a href=\"app.html\">„Passwort vergessen?“</a> einen neuen Link an.", true);
      });
    });
  });

  speichern.addEventListener("click", function(){
    var p1 = document.getElementById("pw1").value;
    var p2 = document.getElementById("pw2").value;
    if (p1.length < 8) { melde("Bitte mindestens 8 Zeichen verwenden.", true); return; }
    if (p1 !== p2)     { melde("Die beiden Eingaben stimmen nicht überein.", true); return; }
    speichern.disabled = true;
    speichern.textContent = "Wird gespeichert …";
    client.auth.updateUser({ password: p1 }).then(function(r){
      if (r.error) throw r.error;
      location.replace("app.html");
    }).catch(function(e){
      speichern.disabled = false;
      speichern.textContent = "Passwort speichern und anmelden";
      melde("Das Passwort konnte nicht gespeichert werden: "
          + ((e && e.message) ? e.message : "unbekannter Fehler"), true);
    });
  });
})();
</script>
</body>
</html>
